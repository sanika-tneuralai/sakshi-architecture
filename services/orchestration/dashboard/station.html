<script type="text/babel">

/* ── Constants ── */
const BASE           = 'http://13.201.133.171:8000';
// Per-camera dashboard URLs (station_id is cosmetic; backend filters by camera_id).
const stationUrl          = (cid, sid) => `${BASE}/dashboard/station?camera_id=${encodeURIComponent(cid)}&station_id=${encodeURIComponent(sid)}`;
const complianceUrl       = (cid, sid) => `${BASE}/dashboard/compliance-violations?camera_id=${encodeURIComponent(cid)}&station_id=${encodeURIComponent(sid)}&limit=200`;
const activeViolationsUrl = (cid, sid) => `${BASE}/dashboard/active-violations?camera_id=${encodeURIComponent(cid)}&station_id=${encodeURIComponent(sid)}`;
const CAMERAS_URL    = `${BASE}/pipeline/cameras`;
const OVERVIEW_URL   = `${BASE}/dashboard/overview`;
const HEALTH_URL     = `${BASE}/health`;
const POLL_MS        = 2000;

/* GPU stream budget: the DeepStream box tops out around 15–16 concurrent
   RTSP streams on the current T4. One charging station == one RTSP stream. */
const STREAM_CAP     = 16;

/* Physical server topology. The orchestration /health endpoint reports each
   dependent service's reachability; we group those services onto the three
   physical hosts they actually run on so the System page reads as "3 servers".
   `role` keys into /health.services. */
const SERVERS = [
  {
    id: 'gpu',
    name: 'Camera-Detection Server',
    subtitle: 'DeepStream · decode + detect',
    kind: 'GPU',
    roles: ['camera_detection'],
    note: 'GPU inference box · DeepStream decode + detect',
  },
  {
    id: 'usecase',
    name: 'Usecase + Alert Server',
    subtitle: 'Business logic · notifications',
    kind: 'CPU',
    roles: ['usecase', 'alert', 'analytics'],
    note: 'Runs the sharded usecase queue, the analytics API, and the alert dispatcher',
  },
  {
    id: 'orchestration',
    name: 'Orchestration Server',
    subtitle: 'Hub · database · this console',
    kind: 'CPU',
    roles: [],              // orchestration itself is always up if this page loaded
    self: true,
    note: 'Central hub, Postgres, and the dashboard',
  },
];

/* Usecases offered when registering a camera (EV charging surveillance set). */
const USECASE_OPTIONS = ['parking_detection', 'vehicle_extraction', 'gun_detection', 'parking_compliance'];

function sessionsUrl(cid, date) {
  const base = `${BASE}/dashboard/sessions?camera_id=${encodeURIComponent(cid)}&limit=100`;
  return date ? `${base}&date=${date}` : base;
}

function todayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }); // YYYY-MM-DD
}
const SLOTS          = ['ROI_1', 'ROI_2'];
const STATION_TZ     = 'Asia/Kolkata';

/* ── Violation map ── */
const VIOLATION_MAP = {
  unauthorized_parking:         { label: 'Unauthorized Parking', color: 'rose'   },
  wrong_parking:                { label: 'Double Slot Parking',  color: 'amber'  },
  non_ev_parking:               { label: 'Non-EV Vehicle',       color: 'sky'    },
  multiple_cars_in_roi:         { label: 'Multiple Cars in Slot',color: 'violet' },
  parking_compliance_triggered: { label: 'Unauthorized Parking', color: 'rose'   },
};

function violationMeta(vtype) {
  return VIOLATION_MAP[vtype] || { label: vtype, color: 'slate' };
}

/* ── Helpers ── */
function display(v) {
  if (v === null || v === undefined || v === '') return null;
  return String(v);
}

function fmtTime(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZone: STATION_TZ,
  });
}

function fmtNowForStation() {
  return new Date().toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZone: STATION_TZ,
  });
}

function durationSecs(inIso, outIso) {
  const start = inIso ? new Date(inIso) : null;
  const end   = outIso ? new Date(outIso) : new Date();
  if (!start || isNaN(start)) return null;
  return Math.floor((end - start) / 1000);
}

function fmtDuration(secs) {
  if (secs === null || secs < 0) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function deduplicateViolations(violations) {
  // Group by violation_type only — car_number is often not visible for
  // double-slot parkers (car spans both ROIs, plate not readable).
  // Keep the entry that has the most data (car_number present preferred).
  const groups = new Map();
  for (const v of violations) {
    const key = v.violation_type || 'unknown';
    if (!groups.has(key)) {
      groups.set(key, { ...v, count: 1 });
    } else {
      const existing = groups.get(key);
      existing.count += 1;
      // Prefer the entry that has car_number or car_model populated
      if (!existing.car_number && v.car_number) existing.car_number = v.car_number;
      if (!existing.car_model  && v.car_model)  existing.car_model  = v.car_model;
      // Keep the longest parking duration
      if (v.duration && (!existing.duration || v.duration > existing.duration)) {
        existing.duration = v.duration;
      }
    }
  }
  return Array.from(groups.values());
}

/* ── SVG Icons ── */

    <circle cx="46" cy="27" r="4" fill="currentColor" opacity=".7"/>

const IconWarning = () => (
  <svg viewBox="0 0 24 24" fill="none" className="w-4 h-4">
    <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

/* ── Status Badge ── */
function StatusBadge({ status }) {
  if (!status) return <span className="text-slate-400 text-xs">—</span>;
  const s = status.toLowerCase();
  const styles = {
    charging:   'bg-brand-50 text-brand-700 ring-brand-100',
    active:     'bg-success-50 text-success-700 ring-success-100',
    completed:  'bg-slate-100 text-slate-600 ring-slate-200',
    incomplete: 'bg-amber-50 text-amber-700 ring-amber-100',
  };
  const cls = styles[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
  return (
    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${cls}`}>
      {s === 'active' || s === 'charging' ? (
        <span className="w-1.5 h-1.5 rounded-full bg-current mr-1.5 animate-pulse-dot" />
      ) : null}
      {status.charAt(0).toUpperCase() + status.slice(1).toLowerCase()}
    </span>
  );
}

/* ── Violation Badge ── */
function ViolationBadge({ vtype }) {
  if (!vtype) return <span className="text-slate-400 text-xs">—</span>;
  const { label, color } = violationMeta(vtype);
  const styles = {
    rose:   'bg-rose-50 text-rose-700 ring-rose-100',
    amber:  'bg-amber-50 text-amber-700 ring-amber-100',
    violet: 'bg-violet-50 text-violet-700 ring-violet-100',
    slate:  'bg-slate-100 text-slate-600 ring-slate-200',
  };
  return (
    <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${styles[color]}`}>
      <IconWarning />
      {label}
    </span>
  );
}

/* ── Parking Bay Card ── */
function BayCard({ slotId, data }) {
  const isEmpty = !data || data.status === 'empty';
  const status  = (data?.status || '').toLowerCase();
  const isActive   = status === 'active' || status === 'charging';

  const bgClass     = isEmpty   ? 'bg-white'
                    : isActive  ? 'bg-gradient-to-br from-success-50 to-white'
                    : 'bg-white';
  const shadowClass = isActive  ? 'shadow-bay-active' : 'shadow-bay-idle';
  const iconColor   = isEmpty   ? 'text-slate-300'
                    : isActive  ? 'text-success-500'
                    : 'text-slate-400';

  const bayLabel = slotId.replace(/ROI_?/i, 'Slot ').trim();

  const Row = ({ label, value, pending, na }) => {
    const v = display(value);
    const text = v !== null ? v
               : pending    ? 'Detecting…'
               : na         ? 'Not yet'
               : '—';
    const textCls = v !== null ? 'text-slate-800 font-medium'
                  : 'text-slate-400 italic text-xs';
    return (
      <div className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
        <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">{label}</span>
        <span className={`text-xs ${textCls}`}>{text}</span>
      </div>
    );
  };

  return (
    <div className={`rounded-2xl p-5 ${bgClass} ${shadowClass} transition-all duration-300`}>
      {/* Card header */}
      <div className="flex items-start justify-between mb-4">
        <div>
          <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-0.5">Parking Bay</p>
          <h3 className="text-lg font-bold text-slate-800">{bayLabel}</h3>
        </div>
        <div className={`${iconColor} mt-1`}>
          <IconCar />
        </div>
      </div>

      {/* Status pill row */}
      <div className="flex items-center gap-2 mb-4">
        <StatusBadge status={isEmpty ? 'empty' : data.status} />
      </div>

      {/* Divider */}
      <div className="h-px bg-slate-100 mb-3" />

      {isEmpty ? (
        <div className="flex flex-col items-center justify-center py-6 text-slate-300">
          <IconPlug />
          <p className="text-xs mt-2 font-medium">Slot available</p>
        </div>
      ) : (
        <div>
          <Row label="Car Number"   value={data.car_number}          pending />
          <Row label="Car Model"    value={data.car_model}           pending />
          <Row label="Car In"       value={fmtTime(data.car_intime)} />
          <Row label="Car Out"      value={fmtTime(data.car_outtime)} na />
          {/* Gun details hidden — energy is now derived from car in/out times.
              <Row label="Gun"          value={data.gun_number}           na />
              <Row label="Plug In"      value={fmtTime(data.gun_plugin_time)}  na />
              <Row label="Plug Out"     value={fmtTime(data.gun_plugout_time)} na />
          */}
          <div className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
            <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">Energy</span>
            {data.energy_kwh != null ? (
              <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700">
                <IconBolt />{data.energy_kwh.toFixed(3)} kWh
              </span>
            ) : (
              <span className="text-slate-400 italic text-xs">
                {data.car_intime ? 'Calculating…' : '—'}
              </span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── NA placeholder ── */
function NA({ text }) {
  return <span className="text-slate-400 italic text-xs">{text || 'Not visible'}</span>;
}

/* ── Sessions Table ── */
function SessionsTable({ sessions }) {
  const ANOMALY_HOURS = 24;
  const cols = ['Session', 'Slot', 'Car Number', 'Car Model', 'Car In', 'Car Out', 'Park Duration', 'Gun', 'Plug In', 'Plug Out', 'Energy (kWh)', 'Status'];

  if (!sessions.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">No sessions found</div>
    );
  }

  return (
    <div className="overflow-x-auto">
    <table className="w-full text-sm">
      <thead className="bg-slate-50/80">
        <tr>
          {cols.map(c => (
            <th key={c} className="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 whitespace-nowrap">
              {c}
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {sessions.map((s, i) => {
          const parkSecs  = durationSecs(s.in_time, s.out_time);
          const parkStr   = fmtDuration(parkSecs);
          const isAnomaly = parkSecs !== null && parkSecs > ANOMALY_HOURS * 3600;
          const slotLabel = s.slot_id ? s.slot_id.replace(/ROI_?/i, 'Slot ').trim() : null;
          return (
            <tr key={s.session_id} className={`transition-colors hover:bg-brand-50/40 ${i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}`}>
              <td className="px-4 py-3 font-mono text-xs">
                <span className="font-semibold text-slate-700">#{sessions.length - i}</span>
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs font-medium whitespace-nowrap">
                {slotLabel || <NA />}
              </td>
              <td className="px-4 py-3 font-mono text-xs font-semibold text-slate-700 whitespace-nowrap">
                {display(s.car_number) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 whitespace-nowrap">
                {display(s.car_model) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.in_time) || <NA text="—" />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.out_time) || <NA text="Active" />}
              </td>
              <td className="px-4 py-3 whitespace-nowrap">
                {parkStr ? (
                  <span className={`font-medium text-xs ${isAnomaly ? 'text-amber-600' : 'text-slate-700'}`}>
                    {parkStr}{isAnomaly && <span className="ml-1 text-amber-500">⚠</span>}
                  </span>
                ) : <NA text="—" />}
              </td>
              <td className="px-4 py-3 font-mono text-xs text-slate-600 whitespace-nowrap">
                {display(s.gun_number) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.plug_time) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.plug_out_time) || <NA />}
              </td>
              <td className="px-4 py-3 whitespace-nowrap">
                {s.session_status === 'completed' && s.energy_kwh != null && s.energy_kwh > 0 ? (
                  <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700">
                    <IconBolt />{s.energy_kwh.toFixed(3)} kWh
                  </span>
                ) : <NA text="—" />}
              </td>
              <td className="px-4 py-3">
                <StatusBadge status={s.session_status} />
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
    </div>
  );
}

/* ── Compliance Gallery ──
   Groups raw alerts into one card per distinct violating car. Same car
   re-triggering the same violation is collapsed; different cars get
   their own cards. The grouping key is alert_id-stable (track_id when
   present, falling back to violation_type + 60s bucket).               */
function groupIncidents(violations) {
  // The /dashboard/compliance-violations endpoint dedupes server-side and
  // returns one row per incident with the full alert_ids list. So this is
  // just a pass-through that normalises fields the gallery + delete button
  // expect (_firstTs for sort, _alertIds for bulk delete).
  return violations
    .map(v => ({
      ...v,
      _firstTs: v.timestamp ? new Date(v.timestamp).getTime() : 0,
      _alertIds: Array.isArray(v.alert_ids) && v.alert_ids.length
        ? v.alert_ids
        : (v.alert_id ? [v.alert_id] : []),
    }))
    .sort((a, b) => b._firstTs - a._firstTs);
}

function fmtTimeIST(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleTimeString('en-IN', {
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata',
    });
  } catch { return ''; }
}

function ComplianceGallery({ violations, todayOnly, onDelete }) {
  const todayStr = todayIST();
  const filtered = todayOnly
    ? violations.filter(v => (v.timestamp || '').startsWith(todayStr))
    : violations;
  const incidents = groupIncidents(filtered).filter(v => v.snapshot_url);

  if (!incidents.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">
        {todayOnly ? 'No violations today' : 'No violations recorded'}
      </div>
    );
  }

  async function handleDelete(ids) {
    if (!ids || !ids.length) return;
    if (!window.confirm(`Delete ${ids.length} violation entr${ids.length === 1 ? 'y' : 'ies'}? This cannot be undone.`)) return;
    const failed = [];
    await Promise.all(ids.map(async (id) => {
      try {
        const r = await fetch(`${BASE}/dashboard/compliance-violations/${id}`, { method: 'DELETE' });
        if (!r.ok) failed.push(id);
      } catch { failed.push(id); }
    }));
    if (failed.length) {
      window.alert(`Failed to delete ${failed.length} of ${ids.length}. The rest were removed.`);
    }
    if (onDelete) onDelete(ids.filter(id => !failed.includes(id)));
  }

  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-4">
      {incidents.map((v, i) => (
        <div key={i} className="relative bg-white border border-slate-100 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
          <button
            type="button"
            onClick={() => handleDelete(v._alertIds || [])}
            title="Delete this violation"
            className="absolute top-2 right-2 z-10 w-7 h-7 rounded-full bg-white/90 hover:bg-rose-50 border border-slate-200 hover:border-rose-300 text-slate-500 hover:text-rose-600 text-sm leading-none flex items-center justify-center shadow-sm transition-colors"
          >
            ×
          </button>

/* ── Energy Loss Table ── */
const CONFIDENCE_LABEL = {
  HIGH:      'Reliable',
  MEDIUM:    'Approximate',
  LOW:       'Weak',
  UNMATCHED: 'No match',
};

function ConfidenceBadge({ level }) {
  const styles = {
    HIGH:      'bg-success-100 text-success-700',
    MEDIUM:    'bg-brand-100 text-brand-700',
    LOW:       'bg-amber-100 text-amber-700',
    UNMATCHED: 'bg-slate-100 text-slate-500',
  };
  return (
    <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide ${styles[level] || styles.UNMATCHED}`}>
      {CONFIDENCE_LABEL[level] || level}
    </span>
  );
}

/* Map raw matcher reasons → plain-English signal chips.
   Collapse duplicates (e.g. "duration" + "time" both mean a time-based signal). */
function humaniseReasons(reasons) {
  if (!reasons || !reasons.length) return [];
  const chips = [];
  const seen = new Set();
  const add = (label) => { if (!seen.has(label)) { seen.add(label); chips.push(label); } };
  for (const r of reasons) {
    if (r === 'VRN') add('Plate');
    else if (r === 'model') add('Model');
    else if (r === 'gun') add('Gun');
    else if (r.startsWith('duration±') || r.startsWith('time±')) add('Time');
    // Skip 'date' (always true within a day), conflicts, and debug penalties.
  }
  return chips;
}

function MatchQualityCell({ confidence, reasons }) {
  const chips = humaniseReasons(reasons);
  return (
    <div className="flex flex-col gap-1">
      <ConfidenceBadge level={confidence} />
      {chips.length > 0 && (
        <div className="flex flex-wrap gap-1" title={`Matched on ${chips.join(' · ')}`}>
          {chips.map(c => (
            <span key={c} className="inline-block px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 text-[10px] font-medium">
              {c}
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

function fmtDurationSecs(secs) {
  if (secs == null) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function EnergyLossTable({ results, summary }) {
  const cols = ['OCPP Date', 'VRN', 'Make / Model', 'Match Quality', 'Connector', 'Duration', 'Client kWh', 'Meter kWh', 'Loss (kWh)'/*, 'Loss %'*/];
  const [dateFilter, setDateFilter] = React.useState('all');

  // Distinct OCPP dates from the current upload (sorted newest-first).
  const availableDates = React.useMemo(() => {
    if (!results) return [];
    const set = new Set();
    for (const r of results) if (r.ocpp_date) set.add(r.ocpp_date);
    return Array.from(set).sort().reverse();
  }, [results]);

  // Reset filter when a fresh upload changes the available date set.
  React.useEffect(() => {
    if (dateFilter !== 'all' && !availableDates.includes(dateFilter)) setDateFilter('all');
  }, [availableDates]); // eslint-disable-line react-hooks/exhaustive-deps

  const filteredResults = React.useMemo(() => {
    if (!results) return results;
    if (dateFilter === 'all') return results;
    return results.filter(r => r.ocpp_date === dateFilter);
  }, [results, dateFilter]);

  // Recompute summary metrics over the filtered rows so the strip reflects
  // exactly what's on screen. Must run BEFORE any early-return — React's
  // rules-of-hooks require the same hook order on every render.
  const visibleSummary = React.useMemo(() => {
    if (dateFilter === 'all' || !summary) return summary;
    const rows = filteredResults || [];
    let matched = 0, client = 0, loss = 0, hasLoss = false;
    for (const r of rows) {
      if (r.matched_session_id != null) matched += 1;
      if (typeof r.client_kwh === 'number') client += r.client_kwh;
      if (typeof r.loss_kwh === 'number') { loss += r.loss_kwh; hasLoss = true; }
    }
    return {
      ...summary,
      total: rows.length,
      matched,
      unmatched: rows.length - matched,
      total_client_kwh: client,
      total_loss_kwh: hasLoss ? loss : null,
    };
  }, [filteredResults, dateFilter, summary]);

  if (!results || !results.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">
        Upload the client OCPP Excel to compare per-gun energy against our meter estimate.
      </div>
    );
  }

  return (
    <div>
      {visibleSummary && (
        <div className="flex flex-wrap items-center gap-4 px-4 py-3 bg-slate-50 border-b border-slate-100 text-xs text-slate-600">
          {availableDates.length > 1 && (
            <label className="flex items-center gap-2">
              <span className="font-semibold text-slate-500 uppercase tracking-wider text-[10px]">Date</span>
              <select
                value={dateFilter}
                onChange={e => setDateFilter(e.target.value)}
                className="px-2 py-1 rounded border border-slate-200 bg-white text-xs text-slate-700 focus:outline-none focus:border-brand-400"
              >
                <option value="all">All ({availableDates.length})</option>
                {availableDates.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            </label>
          )}
          <div><span className="font-semibold text-slate-700">{visibleSummary.total}</span> rows</div>
          <div><span className="font-semibold text-success-700">{visibleSummary.matched}</span> matched</div>
          <div><span className="font-semibold text-slate-500">{visibleSummary.unmatched}</span> unmatched</div>
          {visibleSummary.total_client_kwh != null && (
            <div>Client total: <span className="font-semibold text-slate-700">{visibleSummary.total_client_kwh.toFixed(2)} kWh</span></div>
          )}
          {visibleSummary.total_loss_kwh != null && (
            <div>Total loss: <span className={`font-semibold ${visibleSummary.total_loss_kwh > 0 ? 'text-rose-600' : 'text-slate-700'}`}>{visibleSummary.total_loss_kwh.toFixed(2)} kWh</span></div>
          )}
          {/* Loss % summary hidden — parallel sessions skew total
          {visibleSummary.total_loss_kwh != null && visibleSummary.total_client_kwh > 0 && (
            <div>Loss %: <span className={`font-semibold ${visibleSummary.total_loss_kwh > 0 ? 'text-rose-600' : 'text-slate-700'}`}>{((visibleSummary.total_loss_kwh / visibleSummary.total_client_kwh) * 100).toFixed(1)}%</span></div>
          )} */}
        </div>
      )}
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-slate-50/80">
            <tr>
              {cols.map(c => (
                <th key={c} className="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 whitespace-nowrap">
                  {c}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {(filteredResults || []).map((r, i) => {
              const loss = r.loss_kwh;
              const hasLoss = loss != null;
              /* const lossPct = r.loss_pct != null
                ? r.loss_pct
                : (loss != null && r.client_kwh > 0 ? parseFloat(((loss / r.client_kwh) * 100).toFixed(1)) : null); */
              return (
                <tr key={r.excel_row + '-' + i} className={`transition-colors hover:bg-brand-50/40 ${i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}`}>
                  <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">{r.ocpp_date || <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs font-semibold text-slate-700 whitespace-nowrap">{display(r.vrn) || <NA />}</td>
                  <td className="px-4 py-3 text-slate-600 whitespace-nowrap">
                    {display([r.make, r.model].filter(Boolean).join(' ')) || <NA />}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap align-top">
                    <MatchQualityCell confidence={r.confidence} reasons={r.match_reasons} />
                  </td>
                  <td className="px-4 py-3 text-slate-600 text-xs">{r.connector_id ?? <NA text="—" />}</td>
                  <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">{fmtDurationSecs(r.duration_seconds) || <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-700 whitespace-nowrap">{r.client_kwh != null ? r.client_kwh.toFixed(3) : <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-600 whitespace-nowrap">{r.meter_kwh != null ? r.meter_kwh.toFixed(3) : <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs whitespace-nowrap">
                    {hasLoss ? (
                      <span className={loss > 0.1 ? 'font-semibold text-rose-600' : loss < -0.1 ? 'font-semibold text-amber-600' : 'text-slate-700'}>
                        {loss.toFixed(3)}
                      </span>
                    ) : <NA text="—" />}
                  </td>
                  {/* Loss % column hidden — parallel sessions inflate meter_kwh causing misleading negative %
                  <td className="px-4 py-3 font-mono text-xs whitespace-nowrap">
                    {lossPct != null ? (
                      <span className={lossPct > 1 ? 'font-semibold text-rose-600' : lossPct < -1 ? 'font-semibold text-amber-600' : 'text-slate-700'}>
                        {lossPct > 0 ? '+' : ''}{lossPct.toFixed(1)}%
                      </span>
                    ) : <NA text="—" />}
                  </td> */}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── Bar Chart (Chart.js wrapper) ── */
function BarChart({ labels, datasets, title }) {
  const ref = React.useRef(null);
  const chartRef = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } },
          title:  { display: !!title, text: title, font: { size: 12, weight: 'bold' }, color: '#334155' },
        },
        scales: {
          x: { ticks: { font: { size: 10 }, color: '#64748b' }, grid: { display: false } },
          y: { ticks: { font: { size: 10 }, color: '#64748b' }, beginAtZero: true,
               title: { display: true, text: 'kWh', font: { size: 10 }, color: '#94a3b8' } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [labels, datasets, title]);
  return <canvas ref={ref} />;
}

/* ── ROI drawing: draw the parking-slot polygon on a live snapshot ── */
function ROIEditor({ cameraId, onClose, onSaved }) {
  const canvasRef = React.useRef(null);
  const imgRef    = React.useRef(null);
  const [pts, setPts]       = React.useState([]);   // image-pixel coords [[x,y],...]
  const [status, setStatus] = React.useState('loading'); // loading|ready|error|saving|saved
  const [err, setErr]       = React.useState(null);
  const [dims, setDims]     = React.useState({ w: 900, h: 506, scale: 1 });
  const DISPLAY_W = 900;

  // Pull a live frame (retry while the pipeline warms up ~10s).
  React.useEffect(() => {
    let cancelled = false, tries = 0;
    async function loadSnap() {
      try {
        const r = await fetch(`${BASE}/camera/${encodeURIComponent(cameraId)}/snapshot`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        if (!d.frame) throw new Error('no frame yet');
        const img = new Image();
        img.onload = () => {
          if (cancelled) return;
          const scale = DISPLAY_W / img.naturalWidth;
          imgRef.current = img;
          setDims({ w: DISPLAY_W, h: Math.round(img.naturalHeight * scale), scale });
          setStatus('ready');
        };
        img.src = `data:image/jpeg;base64,${d.frame}`;
      } catch (e) {
        tries += 1;
        if (!cancelled && tries < 15) { setStatus('loading'); setTimeout(loadSnap, 2000); }
        else if (!cancelled) { setErr(e.message); setStatus('error'); }
      }
    }
    loadSnap();
    return () => { cancelled = true; };
  }, [cameraId]);

  // Redraw frame + polygon on every change.
  React.useEffect(() => {
    const c = canvasRef.current, img = imgRef.current;
    if (!c || !img || !(status === 'ready' || status === 'saving' || status === 'saved')) return;
    c.width = dims.w; c.height = dims.h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, dims.w, dims.h);
    if (pts.length) {
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = p[0] * dims.scale, y = p[1] * dims.scale;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      if (pts.length > 2) ctx.closePath();
      ctx.strokeStyle = '#e11d48'; ctx.lineWidth = 2; ctx.stroke();
      if (pts.length > 2) { ctx.fillStyle = 'rgba(225,29,72,0.15)'; ctx.fill(); }
      pts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p[0] * dims.scale, p[1] * dims.scale, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#e11d48'; ctx.fill();
      });
    }
  }, [pts, status, dims]);

  const onCanvasClick = (e) => {
    if (status !== 'ready') return;
    const rect = canvasRef.current.getBoundingClientRect();
    const x = (e.clientX - rect.left) / dims.scale;
    const y = (e.clientY - rect.top) / dims.scale;
    setPts(prev => [...prev, [Math.round(x), Math.round(y)]]);
  };

  async function save() {
    if (pts.length < 3) { setErr('Draw at least 3 points around the slot.'); return; }
    setStatus('saving'); setErr(null);
    try {
      const r = await fetch(`${BASE}/camera/${encodeURIComponent(cameraId)}/rois`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rois: [{ roi_id: 'ROI_1', points: pts, label: 'Slot 1' }] }),
      });
      if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.detail || `HTTP ${r.status}`); }
      setStatus('saved');
      if (onSaved) onSaved();
      setTimeout(onClose, 900);
    } catch (e) { setErr(e.message); setStatus('ready'); }
  }

  return (
    <div className="fixed inset-0 z-[70] bg-black/50 flex items-start justify-center overflow-y-auto py-8 px-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-4xl" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="text-base font-bold text-slate-800">Draw parking slot — {cameraId}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>
        <div className="p-6 space-y-4">
          <p className="text-sm text-slate-500">Click around the parking slot to outline it (≥3 points). This region defines the slot for detection.</p>
          {status === 'loading' && <div className="text-sm text-slate-500">Waiting for a live frame (camera warming up)…</div>}
          {status === 'error' && <div className="text-sm text-rose-600">Couldn't get a frame: {err}. Is the camera running?</div>}
          {(status === 'ready' || status === 'saving' || status === 'saved') && (
            <div className="space-y-3">
              <canvas ref={canvasRef} onClick={onCanvasClick} className="border border-slate-200 rounded-lg cursor-crosshair max-w-full" />
              {err && <div className="text-sm text-rose-600">{err}</div>}
              {status === 'saved' && <div className="text-sm text-success-600">Saved ✓</div>}
              <div className="flex items-center justify-between">
                <span className="text-xs text-slate-500">{pts.length} point(s)</span>
                <div className="flex gap-2">
                  <button onClick={() => setPts(p => p.slice(0, -1))} className="px-3 py-1.5 rounded-lg text-sm border border-slate-200 text-slate-600 hover:bg-slate-50">Undo</button>
                  <button onClick={() => setPts([])} className="px-3 py-1.5 rounded-lg text-sm border border-slate-200 text-slate-600 hover:bg-slate-50">Clear</button>
                  <button onClick={save} disabled={status === 'saving' || pts.length < 3}
                    className={`px-4 py-1.5 rounded-lg text-sm font-semibold text-white ${status === 'saving' || pts.length < 3 ? 'bg-slate-300' : 'bg-brand-600 hover:bg-brand-700'}`}>
                    {status === 'saving' ? 'Saving…' : 'Save slot'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Camera Onboarding Panel (register / list / stop cameras) ──
   Full-page onboarding surface used by the Capacity page. Previously a modal
   ("Manage Cameras"); promoted to a page so onboarding sits next to the GPU
   stream budget it consumes. `capUsed`/`capTotal` gate registration when the
   GPU box is at its stream ceiling. */
function CameraOnboardingPanel({ capUsed = 0, capTotal = STREAM_CAP }) {
  const [cameras, setCameras] = React.useState([]);
  const [loadErr, setLoadErr] = React.useState(null);
  const [camId, setCamId]     = React.useState('');
  const [name, setName]       = React.useState('');
  const [location, setLocation] = React.useState('');
  const [rtsp, setRtsp]       = React.useState('');
  const [fps, setFps]         = React.useState(5);
  const [conf, setConf]       = React.useState(0.5);
  const [poll, setPoll]       = React.useState(1.0);
  const [ucs, setUcs]         = React.useState(['parking_detection']);
  const [busy, setBusy]       = React.useState(false);
  const [msg, setMsg]         = React.useState(null);
  const [roiCam, setRoiCam]   = React.useState(null);   // camera_id whose ROI editor is open
  const [editId, setEditId]       = React.useState(null);   // camera_id being edited inline
  const [editVals, setEditVals]   = React.useState({ name: '', location: '', rtsp_url: '', fps: 5 });
  const [savingEdit, setSavingEdit] = React.useState(false);
  const [editErr, setEditErr]     = React.useState(null);

  async function load() {
    try {
      const r = await fetch(CAMERAS_URL);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const d = await r.json();
      setCameras(d.cameras || []);
      setLoadErr(null);
    } catch (e) { setLoadErr(e.message); }
  }
  React.useEffect(() => { load(); const id = setInterval(load, 3000); return () => clearInterval(id); }, []);

  const toggleUc = (u) => setUcs(prev => prev.includes(u) ? prev.filter(x => x !== u) : [...prev, u]);

  async function register(e) {
    e.preventDefault();
    if (!camId.trim() || !rtsp.trim()) { setMsg({ ok: false, text: 'Camera ID and RTSP URL are required.' }); return; }
    setBusy(true); setMsg(null);
    try {
      const r = await fetch(`${BASE}/pipeline/start/${encodeURIComponent(camId.trim())}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },

          camera_id: camId.trim(), name: name.trim() || null, location: location.trim() || null,
          rtsp_url: rtsp.trim(), fps: Number(fps),

      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || `HTTP ${r.status}`);
      const newId = camId.trim();
      setMsg({ ok: true, text: `Camera "${newId}" registered — draw its parking slot once it warms up (~10s).` });
      setCamId(''); setName(''); setLocation(''); setRtsp('');

                        <div className="flex justify-end gap-2 mt-3">

                            {savingEdit ? 'Saving…' : 'Save changes'}
                          </button>
                        </div>
                      </td>
                    </tr>
                  ) : (
                    /* ── Normal row ── */
                    <tr key={c.camera_id} className="border-t border-slate-50">
                      <td className="px-4 py-3 pl-10">
                        <div className="font-semibold text-slate-700">{c.name || c.camera_id}</div>
                        <div className="text-xs text-slate-400 font-mono">{c.camera_id}</div>
                      </td>
                      <td className="px-4 py-3 text-slate-500 truncate max-w-[220px] font-mono text-xs" title={c.rtsp_url || ''}>{c.rtsp_url || '—'}</td>
                      <td className="px-4 py-3 text-slate-500">{c.fps ?? '—'}</td>
                      <td className="px-4 py-3">
                        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${c.running ? 'bg-success-50 text-success-600' : 'bg-slate-100 text-slate-500'}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${c.running ? 'bg-success-500 animate-pulse-dot' : 'bg-slate-400'}`} />
                          {c.running ? 'running' : 'stopped'}
                        </span>
                        {c.errors > 0 && <span className="ml-2 text-xs text-amber-600">{c.errors} err</span>}
                      </td>
                      <td className="px-4 py-3 text-right whitespace-nowrap">
                        <button onClick={() => startEdit(c)} className="text-xs font-semibold text-slate-600 hover:text-slate-800 mr-3">Edit</button>
                        <button onClick={() => setRoiCam(c.camera_id)} className="text-xs font-semibold text-brand-600 hover:text-brand-700 mr-3">Draw ROI</button>
                        <button onClick={() => stopCam(c.camera_id)} className="text-xs font-semibold text-rose-600 hover:text-rose-700">Stop</button>
                      </td>
                    </tr>
                  )
                ))}
              </tbody>
            ))}
          </table>
        </div>
      </div>
    </div>
    {roiCam && <ROIEditor cameraId={roiCam} onClose={() => setRoiCam(null)} onSaved={load} />}
    </React.Fragment>
  );
}

/* ── Group cameras into locations ──
   A "location" is the camera's free-text `location` field; cameras sharing it
   collapse into one location. A camera with no location set becomes its own
   single-stream location (keyed by camera_id). Each location holds one or more
   streams (cameras) today, ready for multi-stream sites later. */
function groupByLocation(cams) {
  const map = new Map();
  for (const c of cams) {
    const label = (c.location || '').trim();
    const key   = label || c.camera_id;
    if (!map.has(key)) map.set(key, { location: key, named: !!label, cameras: [] });
    map.get(key).cameras.push(c);
  }
  return Array.from(map.values())
    .map(g => ({
      ...g,
      streamCount: g.cameras.length,
      running:     g.cameras.filter(c => c.running).length,
      slotCount:   g.cameras.reduce((s, c) => s + (c.slot_count || 0), 0),
      errors:      g.cameras.reduce((s, c) => s + (c.errors || 0), 0),
    }))
    .sort((a, b) => a.location.localeCompare(b.location));
}

function CapacityPage() {

  React.useEffect(() => {
    async function load() {
      try {
        const r = await fetch(CAMERAS_URL);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const d = await r.json();
        setCams(d.cameras || []); setErr(null);

    load(); const id = setInterval(load, 4000); return () => clearInterval(id);

  );

/* ── System: servers + per-camera pipeline telemetry ── */
const PRETTY_SVC = {
  camera_detection: 'Camera-Detection',
  usecase: 'Usecase',
  alert: 'Alert',
  analytics: 'Analytics',
  orchestration: 'Orchestration',
};

function overallServerStatus(server, services) {
  if (server.self) return 'healthy';           // this console is served by it
  const st = server.roles.map(r => services?.[r]?.status).filter(Boolean);
  if (!st.length) return 'unknown';
  if (st.every(s => s === 'healthy')) return 'healthy';
  if (st.some(s => s === 'unreachable')) return 'unreachable';
  return 'degraded';
}

function ResourceTile({ label, value }) {
  return (
    <div className="rounded-xl bg-slate-50 px-3 py-2.5 text-center">
      <div className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">{label}</div>
      <div className="text-lg font-bold text-slate-700 mt-0.5 tabular-nums">{value}</div>
    </div>
  );
}

function ServiceRow({ name, status }) {
  const map = {
    healthy:     { c: 'text-success-600', d: 'bg-success-500', t: 'healthy' },
    unhealthy:   { c: 'text-amber-600',   d: 'bg-amber-500',   t: 'unhealthy' },
    unreachable: { c: 'text-rose-600',    d: 'bg-rose-500',    t: 'unreachable' },
  };
  const s = map[status] || { c: 'text-slate-400', d: 'bg-slate-300', t: status || 'unknown' };
  return (
    <div className="flex items-center justify-between text-xs">
      <span className="text-slate-600 font-medium">{PRETTY_SVC[name] || name}</span>
      <span className={`inline-flex items-center gap-1.5 font-semibold ${s.c}`}><span className={`w-1.5 h-1.5 rounded-full ${s.d}`} />{s.t}</span>
    </div>
  );
}

function ServerCard({ server, services, runningStreams }) {
  const status = overallServerStatus(server, services);
  const statusMap = {
    healthy:     { chip: 'bg-success-50 text-success-600', dot: 'bg-success-500', label: 'Online' },
    degraded:    { chip: 'bg-amber-50 text-amber-600',     dot: 'bg-amber-500',   label: 'Degraded' },
    unreachable: { chip: 'bg-rose-50 text-rose-600',       dot: 'bg-rose-500',    label: 'Unreachable' },
    unknown:     { chip: 'bg-slate-100 text-slate-500',    dot: 'bg-slate-400',   label: 'Unknown' },
  };
  const sm = statusMap[status] || statusMap.unknown;
  const isGpu = server.kind === 'GPU';
  const host = (() => {
    const svc = server.roles.map(r => services?.[r]?.url).find(Boolean);
    const raw = svc || (server.self ? BASE : null);
    if (!raw) return null;
    try { return new URL(raw).host; } catch { return raw; }
  })();
  return (
    <div className="bg-white rounded-2xl shadow-card p-5">
      <div className="flex items-start justify-between mb-3">
        <div className="flex items-center gap-2.5">
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${isGpu ? 'bg-violet-100 text-violet-600' : 'bg-brand-50 text-brand-600'}`}>{isGpu ? <IconCpu /> : <IconServer />}</div>
          <div>
            <div className="font-bold text-slate-800 text-sm">{server.name}</div>
            <div className="text-[11px] text-slate-400">{server.subtitle}</div>
          </div>
        </div>
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${sm.chip}`}><span className={`w-1.5 h-1.5 rounded-full ${sm.dot} ${status === 'healthy' ? 'animate-pulse-dot' : ''}`} />{sm.label}</span>
      </div>
      <div className="flex items-center gap-2 mb-4">
        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isGpu ? 'bg-violet-50 text-violet-600' : 'bg-slate-100 text-slate-500'}`}>{server.kind}</span>
        {host && <span className="text-[11px] text-slate-400 font-mono truncate">{host}</span>}
      </div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <ResourceTile label="CPU" value="—" />
        <ResourceTile label="GPU" value={isGpu ? '—' : 'n/a'} />
        <ResourceTile label="RAM" value="—" />
      </div>
      <div className="pt-3 border-t border-slate-50">
        <p className="text-[10px] font-bold text-slate-300 uppercase tracking-widest mb-2">Services</p>
        <div className="space-y-1.5">
          {server.self && <ServiceRow name="orchestration" status="healthy" />}
          {server.roles.map(r => <ServiceRow key={r} name={r} status={services?.[r]?.status} />)}
        </div>
      </div>
      <p className="text-[11px] text-slate-400 mt-3">{server.note}</p>
    </div>
  );
}

/* Single metric row (label : value) mirroring the DeepStream perf readout. */
function Metric({ label, value, unit }) {
  const has = value !== null && value !== undefined && value !== '';
  return (

        {has ? <React.Fragment>{value}{unit && <span className="text-slate-400 font-normal ml-0.5">{unit}</span>}</React.Fragment> : '—'}
      </span>
    </div>
  );
}

function PipelineCard({ cam }) {
  const running = !!cam.running;
  return (
    <div className="bg-white rounded-2xl shadow-card overflow-hidden">
      <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className={`w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${running ? 'bg-success-50 text-success-600' : 'bg-slate-100 text-slate-400'}`}><IconCamera /></div>
          <div className="min-w-0">
            <div className="font-semibold text-slate-800 text-sm truncate">{cam.name || cam.camera_id}</div>
            <div className="text-[11px] text-slate-400 font-mono truncate">{cam.camera_id}</div>
          </div>
        </div>
        <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold flex-shrink-0 ${running ? 'bg-success-50 text-success-600' : 'bg-slate-100 text-slate-500'}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${running ? 'bg-success-500 animate-pulse-dot' : 'bg-slate-400'}`} />{running ? 'live' : 'stopped'}
        </span>
      </div>
      <div className="grid grid-cols-2 gap-x-5 px-5 py-3">
        <div>
          <p className="text-[9px] font-bold text-slate-300 uppercase tracking-widest py-1.5">Throughput</p>
          <Metric label="Incoming FPS"  value={running ? (cam.fps ?? null) : null} />
          <Metric label="Decoded FPS"   value={null} />
          <Metric label="Inference FPS" value={null} />
          <Metric label="Tracking FPS"  value={null} />
          <Metric label="Output FPS"    value={null} />
        </div>
        <div>
          <p className="text-[9px] font-bold text-slate-300 uppercase tracking-widest py-1.5">Timing &amp; buffers</p>
          <Metric label="Queue Size"     value={null} />
          <Metric label="Dropped Frames" value={null} />
          <Metric label="Inference Time" value={null} unit="ms" />
          <Metric label="Tracking Time"  value={null} unit="ms" />
          <Metric label="Round-trip"     value={running && cam.avg_latency_ms ? cam.avg_latency_ms.toFixed(0) : null} unit="ms" />
        </div>
      </div>
      <div className="flex items-center justify-between px-5 py-2.5 bg-slate-50/60 text-[11px] text-slate-400 border-t border-slate-100">
        <span>{cam.iterations ? `${cam.iterations.toLocaleString()} frames processed` : 'idle'}</span>
        {cam.errors > 0
          ? <span className="text-amber-600 font-medium">{cam.errors} error{cam.errors === 1 ? '' : 's'}</span>
          : <span>CPU / GPU / RAM → server-level</span>}
      </div>
    </div>
  );
}

function SystemPage() {
  const [health, setHealth] = React.useState(null);
  const [cams, setCams]     = React.useState([]);
  const [err, setErr]       = React.useState(null);
  React.useEffect(() => {
    async function load() {
      try {
        const [hRes, cRes] = await Promise.all([fetch(HEALTH_URL), fetch(CAMERAS_URL)]);
        if (hRes.ok) setHealth(await hRes.json());
        if (cRes.ok) { const d = await cRes.json(); setCams(d.cameras || []); }
        setErr(null);
      } catch (e) { setErr(e.message); }
    }
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);
  const services = health?.services || {};
  const running  = cams.filter(c => c.running).length;
  return (
    <div>
      <PageHeader title="System" sub="Server health and per-camera pipeline telemetry" right={<LiveDot ok={!!health} />} />
      <main className="w-full px-4 sm:px-6 lg:px-10 py-8 space-y-8">
        {err && <ErrorBanner msg={err} />}
        <section>
          <SectionHeader icon={<IconServer />} title="Servers" sub="Three-server deployment" />
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            {SERVERS.map(s => <ServerCard key={s.id} server={s} services={services} runningStreams={running} />)}
          </div>
        </section>
        <section>
          <SectionHeader icon={<IconCamera />} title="Camera Pipelines" sub={`${cams.length} stream${cams.length === 1 ? '' : 's'} · ${running} live`} />
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            {cams.map(c => <PipelineCard key={c.camera_id} cam={c} />)}
            {cams.length === 0 && (
              <div className="col-span-full text-center text-slate-400 py-16 border border-dashed border-slate-200 rounded-2xl bg-white">
                <div className="w-12 h-12 mx-auto mb-3 rounded-xl bg-slate-100 text-slate-300 flex items-center justify-center"><IconCamera /></div>
                <p className="text-sm">No camera pipelines yet. Add a station from <span className="font-semibold text-slate-500">Onboarding</span>.</p>
              </div>
            )}
          </div>
        </section>
      </main>
    </div>
  );
}

function App() {
  const [stationData, setStationData] = React.useState(null);
  const [sessions,    setSessions]    = React.useState([]);
  const [violations,  setViolations]  = React.useState([]);
  const [activeViolations, setActiveViolations] = React.useState([]);
  const [lastUpdated, setLastUpdated] = React.useState(null);
  const [error,       setError]       = React.useState(null);
  const [lossResults, setLossResults] = React.useState(null);
  const [lossSummary, setLossSummary] = React.useState(null);
  const [uploading,   setUploading]   = React.useState(false);
  const [uploadError, setUploadError] = React.useState(null);
  const [uploadName,  setUploadName]  = React.useState(null);
  const [filterDate,  setFilterDate]  = React.useState(todayIST());
  const [violTodayOnly, setViolTodayOnly] = React.useState(true);
  const [insight,            setInsight]            = React.useState(null);
  const [insightAggregates,  setInsightAggregates]  = React.useState(null);
  const [analysing,          setAnalysing]          = React.useState(false);
  const [analyseError,       setAnalyseError]       = React.useState(null);
  const [page,               setPage]               = React.useState('monitor'); // 'monitor' | 'capacity' | 'system'
  const [view,               setView]               = React.useState('overview');  // 'overview' | 'station' (within Monitor)
  const [cameraId,           setCameraId]           = React.useState(null);
  const [stationId,          setStationId]          = React.useState('station_01');
  const [location,           setLocation]           = React.useState(null);   // selected location label
  const [locationCameras,    setLocationCameras]    = React.useState([]);      // streams (cameras) in that location
  const [tab,                setTab]                = React.useState('bays');  // bays | sessions | energy | violations

  const handleExcelUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    setUploadError(null);
    setUploadName(file.name);
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`${BASE}/dashboard/energy-comparison/upload?camera_id=${encodeURIComponent(cameraId || 'camera_01')}`, {
        method: 'POST',
        body: form,
      });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }
      const data = await res.json();
      setLossResults(data.results || []);
      setLossSummary(data.summary || null);
    } catch (e) {
      setUploadError(e.message);
      setLossResults(null);
      setLossSummary(null);
    } finally {
      setUploading(false);
    }
  };

  const handleAnalyse = async () => {
    if (!lossResults || !lossResults.length) return;
    setAnalysing(true);
    setAnalyseError(null);
    setInsight(null);
    try {
      const res = await fetch(`${BASE}/dashboard/energy-analysis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ results: lossResults, summary: lossSummary }),
      });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }
      const data = await res.json();
      setInsight(data.insight || 'No insight returned.');
      setInsightAggregates(data.aggregates || null);
    } catch (e) {
      setAnalyseError(e.message);
    } finally {
      setAnalysing(false);
    }
  };

  React.useEffect(() => {
    if (page !== 'monitor' || view !== 'station' || !cameraId) return;   // only poll the live station view
    async function poll() {
      try {
        const [stRes, seRes, coRes, avRes] = await Promise.all([
          fetch(stationUrl(cameraId, stationId)),
          fetch(sessionsUrl(cameraId, filterDate)),
          fetch(complianceUrl(cameraId, stationId)),
          fetch(activeViolationsUrl(cameraId, stationId)),
        ]);
        if (!stRes.ok) throw new Error(`Station API: HTTP ${stRes.status}`);
        if (!seRes.ok) throw new Error(`Sessions API: HTTP ${seRes.status}`);
        if (!coRes.ok) throw new Error(`Compliance API: HTTP ${coRes.status}`);
        // active-violations is non-critical: never break the dashboard if it fails.

        const st = await stRes.json();
        const se = await seRes.json();
        const co = await coRes.json();
        const av = avRes.ok ? await avRes.json() : { violations: [] };

        setStationData(st);
        setSessions(se.sessions || []);
        setViolations(co.violations || []);
        setActiveViolations(av.violations || []);
        setLastUpdated(fmtNowForStation());
        setError(null);
      } catch (e) {
        setError(e.message);
      }
    }
    poll();
    const id = setInterval(poll, POLL_MS);
    return () => clearInterval(id);
  }, [filterDate, page, view, cameraId, stationId]);

  const openLocation = (loc) => {
    const cams = loc.cameras || [];
    setLocation(loc.location);
    setLocationCameras(cams);
    setCameraId(cams[0] ? cams[0].camera_id : null);   // default to first stream
    setStationId(loc.location);
    setStationData(null); setSessions([]); setViolations([]); setActiveViolations([]);
    setError(null); setLastUpdated(null);
    setTab('bays');
    setView('station');
  };

  // Non-monitor pages render inside the shell without the station polling UI.
  if (page === 'capacity') return <AppShell page={page} setPage={setPage}><CapacityPage /></AppShell>;
  if (page === 'system')   return <AppShell page={page} setPage={setPage}><SystemPage /></AppShell>;

  // Monitor · landing: multi-location overview. Click a card to drill in.
  if (view === 'overview') {
    return (
      <AppShell page={page} setPage={setPage}>
        <Overview onSelect={openLocation} />
      </AppShell>
    );
  }

  const slots        = stationData?.slots || {};
  // Use this camera's actual slot ROIs when present; fall back to the legacy pair.
  const slotIds      = Object.keys(slots).length ? Object.keys(slots).sort() : SLOTS;
  const activeCount  = sessions.filter(s => ['charging', 'active'].includes((s.session_status || '').toLowerCase())).length;
  const slotStatuses = slotIds.map(id => (slots[id]?.status || 'empty').toLowerCase());
  const idleSlots    = slotStatuses.filter(s => s === 'empty').length;
  const violCount    = deduplicateViolations(violations).length;
  const totalKwh     = Object.values(slots).reduce((sum, s) => sum + (s?.energy_kwh ?? 0), 0);

  return (
    <AppShell page={page} setPage={setPage}>

      {/* Floating popup for active parking violations */}
      <ViolationToasts active={activeViolations} />

      {/* ── Breadcrumb / status bar ── */}
      <div className="bg-white border-b border-slate-100">
        <div className="w-full px-4 sm:px-6 lg:px-10 h-14 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2 text-sm min-w-0">
            <button onClick={() => setView('overview')} className="text-slate-500 hover:text-brand-600 flex-shrink-0">Locations</button>
            <span className="text-slate-300">/</span>
            <div className="flex items-center gap-1.5 text-slate-800 font-semibold truncate"><IconStation /><span className="truncate">{location}</span></div>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            <LiveDot ok={!!lastUpdated} />
            {lastUpdated && <span className="text-xs text-slate-400 hidden sm:block">Updated {lastUpdated}</span>}
            <button
              onClick={() => setPage('capacity')}
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 transition-colors">
              + Add station
            </button>
          </div>
        </div>
      </div>

      {/* ── Main content ── */}
      <main className="w-full px-4 sm:px-6 lg:px-10 py-8">

        {/* Error banner */}
        {error && (
          <div className="mb-6 flex items-center gap-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl px-4 py-3 text-sm">
            <IconWarning />
            <span className="font-medium">API Error:</span> {error}
          </div>
        )}

        {/* ── Location header + stream switcher ── */}
        <div className="flex items-end justify-between gap-4 flex-wrap mb-6">
          <div>
            <h1 className="text-2xl font-bold text-slate-800 tracking-tight">{location}</h1>
            <p className="text-sm text-slate-400 mt-0.5">
              {locationCameras.length} stream{locationCameras.length === 1 ? '' : 's'} · {slotIds.length} slot{slotIds.length === 1 ? '' : 's'}
            </p>
          </div>
          <StreamSwitcher cameras={locationCameras} activeId={cameraId} onPick={setCameraId} />
        </div>

        {/* ── Stat Cards (persistent summary strip above the tabs) ── */}
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-6">
          <StatCard label="Streams"          value={locationCameras.length} sub="At this location" accent="slate" icon={<IconStation />} />
          <StatCard label="Active Sessions"  value={activeCount}  sub="Currently charging" accent="green" icon={<IconBolt />} />
          <StatCard label="Idle Slots"       value={idleSlots}    sub="Available now"      accent="blue"  icon={<IconPlug />} />
          <StatCard label="Live Energy"      value={totalKwh > 0 ? `${totalKwh.toFixed(2)} kWh` : '—'} sub="Across active slots" accent="blue" icon={<IconBolt />} />
          <button onClick={() => setTab('violations')} className="text-left focus:outline-none">
            <StatCard label="Violations"     value={violCount}    sub="Tap to review"      accent="amber" icon={<IconWarning />} />
          </button>
        </div>

        {/* ── Tabs ── */}
        <TabBar tab={tab} setTab={setTab} violCount={violCount} />

        {/* ── Parking Bays ── */}
        {tab === 'bays' && (
        <div className="mb-8">
          <SectionHeader
            icon={<IconGrid />}
            title="Live Parking Bays"
            sub={`${stationId} · ${slotIds.length} slot${slotIds.length === 1 ? '' : 's'}`}
          />
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-5">
            {slotIds.map(slotId => (
              <BayCard key={slotId} slotId={slotId} data={slots[slotId]} />
            ))}
          </div>
        </div>
        )}

        {/* ── Energy Loss tab: OCPP upload + comparison table + AI insight ── */}
        {tab === 'energy' && (
        <React.Fragment>
        {/* ── OCPP Excel Upload (sits above the Energy Loss table it feeds) ── */}
        <div className="flex items-center justify-end gap-3 mb-3">
          {uploadName && (
            <span className="text-xs text-slate-500 truncate max-w-[220px]" title={uploadName}>
              {uploadName}
            </span>
          )}
          <label className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-lg cursor-pointer text-xs font-semibold transition-colors border ${uploading ? 'bg-slate-100 text-slate-500 border-slate-200 cursor-wait' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
            {uploading ? 'Processing…' : 'Upload OCPP Excel'}
            <input
              type="file"
              accept=".xlsx,.xlsm"
              disabled={uploading}
              className="hidden"
              onChange={(e) => {
                const f = e.target.files && e.target.files[0];
                if (f) handleExcelUpload(f);
                e.target.value = '';
              }}
            />
          </label>
        </div>
        {uploadError && (
          <div className="mb-4 flex items-center gap-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl px-4 py-3 text-sm">
            <IconWarning />
            <span className="font-medium">Upload failed:</span> {uploadError}
          </div>
        )}

        {/* ── Energy Loss Analysis ── */}
        <div className="mb-8">
          <div className="mb-3">
            <SectionHeader
              icon={<IconBolt />}
              title="Energy Loss Analysis"
              sub="Client OCPP Excel vs. meter-derived estimate"
            />
          </div>
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <EnergyLossTable results={lossResults} summary={lossSummary} />
          </div>

          {/* ── AI Analyse Button ── */}
          {lossResults && lossResults.length > 0 && (
            <div className="mt-4 flex justify-end">
              <button
                onClick={handleAnalyse}
                disabled={analysing}
                className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold transition-colors shadow-sm ${analysing ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-violet-600 hover:bg-violet-700 text-white'}`}
              >
                <svg viewBox="0 0 24 24" fill="none" className="w-4 h-4">
                  <path d="M12 2L9 9H2L7.5 13.5L5.5 21L12 17L18.5 21L16.5 13.5L22 9H15L12 2Z" fill="currentColor"/>
                </svg>
                {analysing ? 'Analysing…' : 'Analyse with AI'}
              </button>
            </div>
          )}

          {/* ── AI Insight Panel ── */}
          {analyseError && (
            <div className="mt-4 flex items-center gap-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl px-4 py-3 text-sm">
              <IconWarning /><span className="font-medium">Analysis failed:</span> {analyseError}
            </div>
          )}
          {insight && <InsightPanel insight={insight} aggregates={insightAggregates} results={lossResults} onDismiss={() => { setInsight(null); setInsightAggregates(null); }} />}
        </div>
        </React.Fragment>
        )}

        {/* ── Sessions Table ── */}
        {tab === 'sessions' && (
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center flex-shrink-0"><IconList /></div>
              <div>
                <h2 className="text-base font-bold text-slate-800">Charging Sessions</h2>
                <p className="text-xs text-slate-400">
                  {sessions.length} session{sessions.length !== 1 ? 's' : ''} on {filterDate}
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Date</label>
              <input
                type="date"
                value={filterDate}
                max={todayIST()}
                onChange={e => setFilterDate(e.target.value)}
                className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
              />
              <button
                onClick={() => setFilterDate(todayIST())}
                className="text-xs px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition-colors"
              >
                Today
              </button>
            </div>
          </div>
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <SessionsTable sessions={sessions} />
          </div>
        </div>
        )}

        {/* ── Parking Compliance Violations ── */}
        {tab === 'violations' && (
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center flex-shrink-0"><IconWarning /></div>
              <div>
                <h2 className="text-base font-bold text-slate-800">Parking Compliance Violations</h2>
                <p className="text-xs text-slate-400">Snapshot evidence of unauthorized or wrong parking</p>
              </div>
            </div>
            <div className="inline-flex rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
              <button
                onClick={() => setViolTodayOnly(true)}
                className={`px-3 py-1.5 transition-colors ${violTodayOnly ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}
              >
                Today
              </button>
              <button
                onClick={() => setViolTodayOnly(false)}
                className={`px-3 py-1.5 transition-colors ${!violTodayOnly ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-50'}`}
              >
                All
              </button>
            </div>
          </div>
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <ComplianceGallery
              violations={violations}
              todayOnly={violTodayOnly}
              onDelete={(ids) => {
                const removed = new Set(ids);
                setViolations(prev => prev.filter(v => !removed.has(v.alert_id)));
              }}
            />
          </div>
        </div>
        )}

      </main>
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
