<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Station Monitor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 24px 16px;
    }

    #root { max-width: 1000px; margin: 0 auto; }

    /* ── Header ── */
    .page-title {
      font-size: 18px;
      font-weight: bold;
      color: #111;
      margin-bottom: 2px;
      letter-spacing: 0.04em;
    }
    .page-subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 28px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    /* ── Network Overview ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    .stat-box {
      border: 1px solid #ddd;
      background: #fff;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: bold;
      color: #111;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-sub {
      font-size: 11px;
      color: #aaa;
    }

    /* ── Sessions Table ── */
    .sessions-wrap {
      margin-bottom: 32px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      border-bottom: 1px solid #ddd;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      color: #888;
      font-weight: normal;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      color: #333;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }

    .td-null { color: #ccc; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }
    .badge-charging           { background: #e3f2fd; color: #0277bd; }
    .badge-active             { background: #e8f5e9; color: #2e7d32; }
    .badge-completed          { background: #f5f5f5; color: #888; }
    .badge-incomplete         { background: #fff3e0; color: #e65100; }
    .badge-unauthorized       { background: #fce4ec; color: #b71c1c; }
    .badge-wrong              { background: #fff3e0; color: #bf360c; }
    .badge-multiple           { background: #f3e5f5; color: #6a1b9a; }

    .count-pill {
      display: inline-block;
      background: #eee;
      color: #555;
      font-size: 10px;
      font-weight: bold;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .duration-warn {
      color: #e65100;
    }

    .empty-row td {
      text-align: center;
      color: #bbb;
      padding: 24px;
    }

    /* ── Slot Cards ── */
    .slots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .slots-grid { grid-template-columns: 1fr; }
    }

    .slot-box {
      border: 1px solid #ddd;
      padding: 16px 18px;
      background: #fff;
    }

    .slot-name {
      font-size: 14px;
      font-weight: bold;
      color: #111;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .field-row {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .field-label {
      color: #999;
      min-width: 130px;
      flex-shrink: 0;
    }

    .field-value        { color: #333; }
    .field-value.null   { color: #ccc; }

    .status-charging  { color: #0277bd; font-weight: bold; }
    .status-active    { color: #2e7d32; font-weight: bold; }
    .status-completed { color: #888; }
    .status-empty     { color: #bbb; }
    .violation-value  { color: #e53935; }

    .error-box {
      color: #c62828;
      font-size: 12px;
      border: 1px solid #ffcdd2;
      padding: 10px 14px;
      background: #ffebee;
      margin-bottom: 20px;
    }

    /* ── Last updated + live dot ── */
    .last-updated {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4caf50;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%   { opacity: 1; }
      50%  { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const BASE            = 'http://13.201.133.171:8000';
const STATION_URL     = `${BASE}/dashboard/station?camera_id=camera_01&station_id=station_01`;
const SESSIONS_URL    = `${BASE}/dashboard/sessions?camera_id=camera_01&limit=10`;
const COMPLIANCE_URL  = `${BASE}/dashboard/compliance-violations?camera_id=camera_01&station_id=station_01&limit=10`;
const POLL_MS         = 2000;
const SLOTS           = ['ROI_1', 'ROI_2'];

/* ── Violation label map (covers all known backend keys) ── */
const VIOLATION_MAP = {
  unauthorized_parking:        ['badge-unauthorized', 'Unauthorized Parking'],
  wrong_parking:               ['badge-wrong',        'Double Slot Parking'],
  multiple_cars_in_roi:        ['badge-multiple',     'Multiple Cars in Slot'],
  parking_compliance_triggered:['badge-unauthorized', 'Unauthorized Parking'],
};

function violationLabel(vtype) {
  if (!vtype) return null;
  const entry = VIOLATION_MAP[vtype];
  return entry ? entry[1] : vtype;
}

function violationBadgeClass(vtype) {
  if (!vtype) return '';
  const entry = VIOLATION_MAP[vtype];
  return entry ? entry[0] : '';
}

/* ── helpers ── */
function display(v) {
  if (v === null || v === undefined || v === '') return null;
  return String(v);
}

function fmtTime(iso) {
  if (!iso) return null;
  try { return new Date(iso).toLocaleTimeString(); } catch { return iso; }
}

function durationSecs(inIso, outIso) {
  const start = inIso ? new Date(inIso) : null;
  const end   = outIso ? new Date(outIso) : new Date();
  if (!start || isNaN(start)) return null;
  return Math.floor((end - start) / 1000);
}

function fmtDuration(secs) {
  if (secs === null || secs < 0) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function statusBadge(status) {
  if (!status) return <span className="td-null">--</span>;
  const cls = {
    charging:   'badge-charging',
    active:     'badge-active',
    completed:  'badge-completed',
    incomplete: 'badge-incomplete',
  }[status.toLowerCase()] || '';
  return <span className={`badge ${cls}`}>{status.toUpperCase()}</span>;
}

/* ── Deduplicate violations: group by car_number + violation_type ── */
function deduplicateViolations(violations) {
  const groups = new Map();
  for (const v of violations) {
    const key = `${v.car_number || ''}__${v.violation_type || ''}`;
    if (!groups.has(key)) {
      groups.set(key, { ...v, count: 1 });
    } else {
      groups.get(key).count += 1;
    }
  }
  return Array.from(groups.values());
}

/* ── Field row ── */
// nullLabel: what to show when value is absent
//   'pending'  → "Detecting..."  (data expected but not yet arrived)
//   'na'       → "Not yet"       (event hasn't happened yet, e.g. plug-in)
//   'none'     → "None"          (confirmed no value, e.g. no violation)
//   default    → "--"
function Field({ label, value, className, nullLabel }) {
  const v = display(value);
  let nullText = '--';
  if (v === null) {
    if (nullLabel === 'pending') nullText = 'Detecting…';
    else if (nullLabel === 'na')  nullText = 'Not yet';
    else if (nullLabel === 'none') nullText = 'None';
  }
  return (
    <div className="field-row">
      <span className="field-label">{label}</span>
      <span className={`field-value${v === null ? ' null' : ''}${className ? ' ' + className : ''}`}>
        {v !== null ? v : nullText}
      </span>
    </div>
  );
}

/* ── Slot card ── */
function SlotCard({ slotId, data }) {
  const isEmpty = !data || data.status === 'empty';
  const statusCls = () => {
    if (!data) return '';
    const s = (data.status || '').toLowerCase();
    if (s === 'charging') return 'status-charging';
    if (s === 'active')   return 'status-active';
    if (s === 'completed') return 'status-completed';
    return '';
  };

  const violationDisplay = data?.violation ? violationLabel(data.violation) : null;

  return (
    <div className="slot-box">
      <div className="slot-name">{slotId}</div>
      {isEmpty ? (
        <Field label="Status" value="EMPTY" className="status-empty" />
      ) : (
        <>
          <Field label="Car Number"    value={data.car_number}          nullLabel="pending" />
          <Field label="Car Model"     value={data.car_model}           nullLabel="pending" />
          <Field label="Car In Time"   value={fmtTime(data.car_intime)} />
          <Field label="Car Out Time"  value={fmtTime(data.car_outtime)} nullLabel="na" />
          <Field label="Gun Number"    value={data.gun_number}           nullLabel="na" />
          <Field label="Plug In Time"  value={fmtTime(data.gun_plugin_time)}  nullLabel="na" />
          <Field label="Plug Out Time" value={fmtTime(data.gun_plugout_time)} nullLabel="na" />
          <Field label="Status"        value={data.status ? data.status.toUpperCase() : null} className={statusCls()} />
          <Field label="Violation"     value={violationDisplay} nullLabel="none" className={violationDisplay ? 'violation-value' : ''} />
        </>
      )}
    </div>
  );
}

/* ── Sessions table ── */
function SessionsTable({ sessions }) {
  const ANOMALY_HOURS = 24;

  if (!sessions.length) {
    return (
      <table>
        <thead>
          <tr>
            <th>Session ID</th><th>Station</th><th>Car Model</th>
            <th>Region</th><th>Duration</th><th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr className="empty-row"><td colSpan="6">No sessions found</td></tr>
        </tbody>
      </table>
    );
  }

  return (
    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Station</th>
          <th>Car Model</th>
          <th>Region</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {sessions.map(s => {
          const secs = durationSecs(s.in_time, s.out_time);
          const durStr = fmtDuration(secs);
          const isAnomaly = secs !== null && secs > ANOMALY_HOURS * 3600;
          return (
            <tr key={s.session_id}>
              <td>#{s.session_id}</td>
              <td>Station 1</td>
              <td>{display(s.car_model) || <span className="td-null">--</span>}</td>
              <td>Kochi</td>
              <td>
                {durStr
                  ? <span className={isAnomaly ? 'duration-warn' : ''}>{durStr}{isAnomaly ? ' !' : ''}</span>
                  : <span className="td-null">--</span>
                }
              </td>
              <td>{statusBadge(s.session_status)}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

/* ── Violation type badge ── */
function ViolationBadge({ vtype }) {
  if (!vtype) return <span className="td-null">--</span>;
  const cls   = violationBadgeClass(vtype);
  const label = violationLabel(vtype);
  return <span className={`badge ${cls}`}>{label}</span>;
}

/* ── Compliance violations table ── */
function ComplianceTable({ violations }) {
  const cols = ['Station', 'Car Number', 'Car Model', 'Violation Type', 'Duration', 'Count'];
  const deduped = deduplicateViolations(violations);

  if (!deduped.length) {
    return (
      <table>
        <thead><tr>{cols.map(c => <th key={c}>{c}</th>)}</tr></thead>
        <tbody><tr className="empty-row"><td colSpan={cols.length}>No violations found</td></tr></tbody>
      </table>
    );
  }

  return (
    <table>
      <thead><tr>{cols.map(c => <th key={c}>{c}</th>)}</tr></thead>
      <tbody>
        {deduped.map((v, i) => (
          <tr key={i}>
            <td>{v.station || 'Station 1'}</td>
            <td>{display(v.car_number) || <span className="td-null">--</span>}</td>
            <td>{display(v.car_model) || <span className="td-null">--</span>}</td>
            <td><ViolationBadge vtype={v.violation_type} /></td>
            <td>{display(v.duration) || <span className="td-null">--</span>}</td>
            <td>
              {v.count > 1
                ? <span className="count-pill">×{v.count}</span>
                : <span className="td-null">1</span>}
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

/* ── App ── */
function App() {
  const [stationData,  setStationData]  = React.useState(null);
  const [sessions,     setSessions]     = React.useState([]);
  const [violations,   setViolations]   = React.useState([]);
  const [lastUpdated,  setLastUpdated]  = React.useState(null);
  const [error,        setError]        = React.useState(null);

  React.useEffect(() => {
    async function poll() {
      try {
        const [stRes, seRes, coRes] = await Promise.all([
          fetch(STATION_URL),
          fetch(SESSIONS_URL),
          fetch(COMPLIANCE_URL),
        ]);
        if (!stRes.ok) throw new Error(`Station API: HTTP ${stRes.status}`);
        if (!seRes.ok) throw new Error(`Sessions API: HTTP ${seRes.status}`);
        if (!coRes.ok) throw new Error(`Compliance API: HTTP ${coRes.status}`);

        const st = await stRes.json();
        const se = await seRes.json();
        const co = await coRes.json();

        setStationData(st);
        setSessions(se.sessions || []);
        setViolations(co.violations || []);
        setLastUpdated(new Date().toLocaleTimeString());
        setError(null);
      } catch (e) {
        setError(e.message);
      }
    }

    poll();
    const id = setInterval(poll, POLL_MS);
    return () => clearInterval(id);
  }, []);

  const slots = stationData?.slots || {};

  /* Network overview stats — derived from slot data, not session list */
  const totalStations  = 1;
  const activeCount    = sessions.filter(s => ['charging', 'active'].includes((s.session_status || '').toLowerCase())).length;
  const slotStatuses   = SLOTS.map(id => (slots[id]?.status || 'empty').toLowerCase());
  const idleSlots      = slotStatuses.filter(s => s === 'empty').length;

  return (
    <>
      <div className="page-title">EV Charging Monitor</div>
      <div className="last-updated">
        {lastUpdated
          ? <><span className="live-dot" /><span>Last updated: {lastUpdated}</span></>
          : 'Connecting…'}
      </div>

      {error && <div className="error-box">Error: {error}</div>}

      {/* ── Network Overview ── */}
      <div className="section-label">Network Overview — Real-time status across all stations</div>
      <div className="stats-grid">
        <div className="stat-box">
          <div className="stat-label">Total Stations</div>
          <div className="stat-value">{totalStations}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Active Sessions</div>
          <div className="stat-value">{activeCount}</div>
          <div className="stat-sub">Currently charging</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Idle Slots</div>
          <div className="stat-value">{idleSlots}</div>
        </div>
      </div>

      {/* ── Live Slot Status ── */}
      <div className="section-label" style={{marginBottom: '10px'}}>
        Live Slot Status — {stationData?.station_id || 'station_01'}
      </div>
      <div className="slots-grid" style={{marginBottom: '32px'}}>
        {SLOTS.map(slotId => (
          <SlotCard key={slotId} slotId={slotId} data={slots[slotId]} />
        ))}
      </div>

      {/* ── Charging Sessions Table ── */}
      <div className="section-label" style={{marginBottom: '10px'}}>Charging Sessions</div>
      <div className="sessions-wrap">
        <SessionsTable sessions={sessions} />
      </div>

      {/* ── Parking Compliance Violations ── */}
      <div className="section-label" style={{marginBottom: '10px'}}>Parking Compliance Violations</div>
      <div className="sessions-wrap">
        <ComplianceTable violations={violations} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
