<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Station Monitor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8' },
            success: { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d' },
            amber:  { 50:'#fffbeb', 100:'#fef3c7', 500:'#f59e0b', 600:'#d97706', 700:'#b45309' },
            rose:   { 50:'#fff1f2', 100:'#ffe4e6', 500:'#f43f5e', 600:'#e11d48', 700:'#be123c' },
            violet: { 50:'#f5f3ff', 100:'#ede9fe', 500:'#8b5cf6', 600:'#7c3aed' },
            slate:  {
              50:'#f8fafc', 100:'#f1f5f9', 200:'#e2e8f0', 300:'#cbd5e1',
              400:'#94a3b8', 500:'#64748b', 600:'#475569', 700:'#334155',
              800:'#1e293b', 900:'#0f172a'
            },
          },
          boxShadow: {
            card: '0 1px 3px 0 rgba(0,0,0,.06), 0 4px 24px 0 rgba(0,0,0,.04)',
            'card-hover': '0 4px 12px 0 rgba(0,0,0,.08), 0 8px 32px 0 rgba(0,0,0,.06)',
            'bay-active': '0 0 0 2px #22c55e, 0 4px 24px 0 rgba(34,197,94,.10)',
            'bay-idle':   '0 1px 3px 0 rgba(0,0,0,.06), 0 4px 16px 0 rgba(0,0,0,.04)',
          },
          animation: { 'pulse-dot': 'pulseDot 2s ease-in-out infinite' },
          keyframes:  { pulseDot: { '0%,100%': { opacity: 1 }, '50%': { opacity: .35 } } },
        }
      }
    }
  </script>
  <style>
    body { background-color: #F9FAFB; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="font-sans text-slate-800 min-h-screen">
<div id="root"></div>

<script type="text/babel">

/* ── Constants ── */
const BASE           = 'http://13.201.133.171:8000';
const STATION_URL    = `${BASE}/dashboard/station?camera_id=camera_01&station_id=station_01`;
const COMPLIANCE_URL = `${BASE}/dashboard/compliance-violations?camera_id=camera_01&station_id=station_01&limit=10`;
const POLL_MS        = 2000;

function sessionsUrl(date) {
  const base = `${BASE}/dashboard/sessions?camera_id=camera_01&limit=100`;
  return date ? `${base}&date=${date}` : base;
}

function todayIST() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' }); // YYYY-MM-DD
}
const SLOTS          = ['ROI_1', 'ROI_2'];
const STATION_TZ     = 'Asia/Kolkata';

/* ── Violation map ── */
const VIOLATION_MAP = {
  unauthorized_parking:         { label: 'Unauthorized Parking', color: 'rose' },
  wrong_parking:                { label: 'Double Slot Parking',  color: 'amber' },
  multiple_cars_in_roi:         { label: 'Multiple Cars in Slot',color: 'violet' },
  parking_compliance_triggered: { label: 'Unauthorized Parking', color: 'rose' },
};

function violationMeta(vtype) {
  return VIOLATION_MAP[vtype] || { label: vtype, color: 'slate' };
}

/* ── Helpers ── */
function display(v) {
  if (v === null || v === undefined || v === '') return null;
  return String(v);
}

function fmtTime(v) {
  if (!v) return null;
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZone: STATION_TZ,
  });
}

function fmtNowForStation() {
  return new Date().toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
    timeZone: STATION_TZ,
  });
}

function durationSecs(inIso, outIso) {
  const start = inIso ? new Date(inIso) : null;
  const end   = outIso ? new Date(outIso) : new Date();
  if (!start || isNaN(start)) return null;
  return Math.floor((end - start) / 1000);
}

function fmtDuration(secs) {
  if (secs === null || secs < 0) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function deduplicateViolations(violations) {
  // Group by violation_type only — car_number is often not visible for
  // double-slot parkers (car spans both ROIs, plate not readable).
  // Keep the entry that has the most data (car_number present preferred).
  const groups = new Map();
  for (const v of violations) {
    const key = v.violation_type || 'unknown';
    if (!groups.has(key)) {
      groups.set(key, { ...v, count: 1 });
    } else {
      const existing = groups.get(key);
      existing.count += 1;
      // Prefer the entry that has car_number or car_model populated
      if (!existing.car_number && v.car_number) existing.car_number = v.car_number;
      if (!existing.car_model  && v.car_model)  existing.car_model  = v.car_model;
      // Keep the longest parking duration
      if (v.duration && (!existing.duration || v.duration > existing.duration)) {
        existing.duration = v.duration;
      }
    }
  }
  return Array.from(groups.values());
}

/* ── SVG Icons ── */
const IconCar = () => (
  <svg viewBox="0 0 64 32" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-16 h-8">
    <rect x="8" y="12" width="48" height="14" rx="4" fill="currentColor" opacity=".15"/>
    <path d="M14 12 L20 4 H44 L50 12" stroke="currentColor" strokeWidth="2" strokeLinejoin="round" fill="currentColor" opacity=".25"/>
    <circle cx="18" cy="27" r="4" fill="currentColor" opacity=".7"/>
    <circle cx="46" cy="27" r="4" fill="currentColor" opacity=".7"/>
    <rect x="24" y="6" width="16" height="6" rx="1" fill="currentColor" opacity=".3"/>
  </svg>
);

const IconPlug = () => (
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-5 h-5">
    <path d="M18 7v4a6 6 0 01-12 0V7" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
    <path d="M12 17v4M8 7V3M16 7V3" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
  </svg>
);

const IconBolt = () => (
  <svg viewBox="0 0 24 24" fill="none" className="w-4 h-4">
    <path d="M13 2L4.5 13.5H11L10 22L20.5 9.5H14L13 2Z" fill="currentColor"/>
  </svg>
);

const IconStation = () => (
  <svg viewBox="0 0 24 24" fill="none" className="w-4 h-4">
    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="1.5"/>
    <path d="M8 17V10M12 17V7M16 17V13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
  </svg>
);

const IconWarning = () => (
  <svg viewBox="0 0 24 24" fill="none" className="w-4 h-4">
    <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>
);

/* ── Status Badge ── */
function StatusBadge({ status }) {
  if (!status) return <span className="text-slate-400 text-xs">—</span>;
  const s = status.toLowerCase();
  const styles = {
    charging:   'bg-brand-50 text-brand-700 ring-brand-100',
    active:     'bg-success-50 text-success-700 ring-success-100',
    completed:  'bg-slate-100 text-slate-600 ring-slate-200',
    incomplete: 'bg-amber-50 text-amber-700 ring-amber-100',
  };
  const cls = styles[s] || 'bg-slate-100 text-slate-600 ring-slate-200';
  return (
    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${cls}`}>
      {s === 'active' || s === 'charging' ? (
        <span className="w-1.5 h-1.5 rounded-full bg-current mr-1.5 animate-pulse-dot" />
      ) : null}
      {status.charAt(0).toUpperCase() + status.slice(1).toLowerCase()}
    </span>
  );
}

/* ── Violation Badge ── */
function ViolationBadge({ vtype }) {
  if (!vtype) return <span className="text-slate-400 text-xs">—</span>;
  const { label, color } = violationMeta(vtype);
  const styles = {
    rose:   'bg-rose-50 text-rose-700 ring-rose-100',
    amber:  'bg-amber-50 text-amber-700 ring-amber-100',
    violet: 'bg-violet-50 text-violet-700 ring-violet-100',
    slate:  'bg-slate-100 text-slate-600 ring-slate-200',
  };
  return (
    <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ring-1 ring-inset ${styles[color]}`}>
      <IconWarning />
      {label}
    </span>
  );
}

/* ── Parking Bay Card ── */
function BayCard({ slotId, data }) {
  const isEmpty = !data || data.status === 'empty';
  const status  = (data?.status || '').toLowerCase();
  const isActive   = status === 'active' || status === 'charging';

  const bgClass     = isEmpty   ? 'bg-white'
                    : isActive  ? 'bg-gradient-to-br from-success-50 to-white'
                    : 'bg-white';
  const shadowClass = isActive  ? 'shadow-bay-active' : 'shadow-bay-idle';
  const iconColor   = isEmpty   ? 'text-slate-300'
                    : isActive  ? 'text-success-500'
                    : 'text-slate-400';

  const bayLabel = slotId.replace(/ROI_?/i, 'Slot ').trim();
  const violationDisplay = data?.violation ? violationMeta(data.violation).label : null;

  const Row = ({ label, value, pending, na }) => {
    const v = display(value);
    const text = v !== null ? v
               : pending    ? 'Detecting…'
               : na         ? 'Not yet'
               : '—';
    const textCls = v !== null ? 'text-slate-800 font-medium'
                  : 'text-slate-400 italic text-xs';
    return (
      <div className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
        <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">{label}</span>
        <span className={`text-xs ${textCls}`}>{text}</span>
      </div>
    );
  };

  return (
    <div className={`rounded-2xl p-5 ${bgClass} ${shadowClass} transition-all duration-300`}>
      {/* Card header */}
      <div className="flex items-start justify-between mb-4">
        <div>
          <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-0.5">Parking Bay</p>
          <h3 className="text-lg font-bold text-slate-800">{bayLabel}</h3>
        </div>
        <div className={`${iconColor} mt-1`}>
          <IconCar />
        </div>
      </div>

      {/* Status pill row */}
      <div className="flex items-center gap-2 mb-4">
        <StatusBadge status={isEmpty ? 'empty' : data.status} />
        {!isEmpty && violationDisplay && (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-600 ring-1 ring-inset ring-rose-100">
            <IconWarning />{violationDisplay}
          </span>
        )}
        {!isEmpty && !violationDisplay && (
          <span className="text-xs text-success-600 font-medium">✓ No violation</span>
        )}
      </div>

      {/* Divider */}
      <div className="h-px bg-slate-100 mb-3" />

      {isEmpty ? (
        <div className="flex flex-col items-center justify-center py-6 text-slate-300">
          <IconPlug />
          <p className="text-xs mt-2 font-medium">Slot available</p>
        </div>
      ) : (
        <div>
          <Row label="Car Number"   value={data.car_number}          pending />
          <Row label="Car Model"    value={data.car_model}           pending />
          <Row label="Car In"       value={fmtTime(data.car_intime)} />
          <Row label="Car Out"      value={fmtTime(data.car_outtime)} na />
          <Row label="Gun"          value={data.gun_number}           na />
          <Row label="Plug In"      value={fmtTime(data.gun_plugin_time)}  na />
          <Row label="Plug Out"     value={fmtTime(data.gun_plugout_time)} na />
          <div className="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
            <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">Energy</span>
            {data.energy_kwh != null ? (
              <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700">
                <IconBolt />{data.energy_kwh.toFixed(3)} kWh
              </span>
            ) : (
              <span className="text-slate-400 italic text-xs">
                {data.gun_plugin_time ? 'Calculating…' : '—'}
              </span>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── NA placeholder ── */
function NA({ text }) {
  return <span className="text-slate-400 italic text-xs">{text || 'Not visible'}</span>;
}

/* ── Sessions Table ── */
function SessionsTable({ sessions }) {
  const ANOMALY_HOURS = 24;
  const cols = ['Session', 'Slot', 'Car Number', 'Car Model', 'Car In', 'Car Out', 'Park Duration', 'Gun', 'Plug In', 'Plug Out', 'Energy (kWh)', 'Status'];

  if (!sessions.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">No sessions found</div>
    );
  }

  return (
    <div className="overflow-x-auto">
    <table className="w-full text-sm">
      <thead>
        <tr>
          {cols.map(c => (
            <th key={c} className="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 whitespace-nowrap">
              {c}
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {sessions.map((s, i) => {
          const parkSecs  = durationSecs(s.in_time, s.out_time);
          const parkStr   = fmtDuration(parkSecs);
          const isAnomaly = parkSecs !== null && parkSecs > ANOMALY_HOURS * 3600;
          const slotLabel = s.slot_id ? s.slot_id.replace(/ROI_?/i, 'Slot ').trim() : null;
          return (
            <tr key={s.session_id} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}>
              <td className="px-4 py-3 font-mono text-xs">
                <span className="font-semibold text-slate-700">#{s.session_id}</span>
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs font-medium whitespace-nowrap">
                {slotLabel || <NA />}
              </td>
              <td className="px-4 py-3 font-mono text-xs font-semibold text-slate-700 whitespace-nowrap">
                {display(s.car_number) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 whitespace-nowrap">
                {display(s.car_model) || <NA />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.in_time) || <NA text="—" />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.out_time) || <NA text="Active" />}
              </td>
              <td className="px-4 py-3 whitespace-nowrap">
                {parkStr ? (
                  <span className={`font-medium text-xs ${isAnomaly ? 'text-amber-600' : 'text-slate-700'}`}>
                    {parkStr}{isAnomaly && <span className="ml-1 text-amber-500">⚠</span>}
                  </span>
                ) : <NA text="—" />}
              </td>
              <td className="px-4 py-3 font-mono text-xs text-slate-600 whitespace-nowrap">
                {display(s.gun_number) || <NA text="—" />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.plug_time) || <NA text="—" />}
              </td>
              <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">
                {fmtTime(s.plug_out_time) || <NA text="—" />}
              </td>
              <td className="px-4 py-3 whitespace-nowrap">
                {s.session_status === 'completed' && s.energy_kwh != null && s.energy_kwh > 0 ? (
                  <span className="inline-flex items-center gap-1 text-xs font-semibold text-brand-700">
                    <IconBolt />{s.energy_kwh.toFixed(3)} kWh
                  </span>
                ) : <NA text="—" />}
              </td>
              <td className="px-4 py-3">
                <StatusBadge status={s.session_status} />
              </td>
            </tr>
          );
        })}
      </tbody>
    </table>
    </div>
  );
}

/* ── Compliance Table ── */
function ComplianceTable({ violations }) {
  const deduped = deduplicateViolations(violations);
  const cols    = ['Car Number', 'Car Model', 'Violation', 'Parking Duration', 'Count'];

  if (!deduped.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">No violations recorded</div>
    );
  }

  return (
    <table className="w-full text-sm">
      <thead>
        <tr>
          {cols.map(c => (
            <th key={c} className="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100">
              {c}
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {deduped.map((v, i) => (
          <tr key={i} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}>
            <td className="px-4 py-3 font-mono text-xs font-semibold text-slate-700">
              {display(v.car_number) || <NA />}
            </td>
            <td className="px-4 py-3 text-slate-600">
              {display(v.car_model) || <NA />}
            </td>
            <td className="px-4 py-3">
              <ViolationBadge vtype={v.violation_type} />
            </td>
            <td className="px-4 py-3 text-slate-600 font-medium text-xs">
              {display(v.duration) || <NA text="—" />}
            </td>
            <td className="px-4 py-3">
              <span className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 text-xs font-bold">
                {v.count}
              </span>
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

/* ── Energy Loss Table ── */
function ConfidenceBadge({ level }) {
  const styles = {
    HIGH:      'bg-success-100 text-success-700',
    MEDIUM:    'bg-brand-100 text-brand-700',
    LOW:       'bg-amber-100 text-amber-700',
    UNMATCHED: 'bg-slate-100 text-slate-500',
  };
  return (
    <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${styles[level] || styles.UNMATCHED}`}>
      {level}
    </span>
  );
}

function fmtDurationSecs(secs) {
  if (secs == null) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function EnergyLossTable({ results, summary }) {
  const cols = ['OCPP Date', 'VRN', 'Make / Model', 'Connector', 'Duration', 'Client kWh', 'Meter kWh', 'Loss (kWh)', 'Match', 'Why'];

  if (!results || !results.length) {
    return (
      <div className="py-12 text-center text-slate-400 text-sm">
        Upload the client OCPP Excel to compare per-gun energy against our meter estimate.
      </div>
    );
  }

  return (
    <div>
      {summary && (
        <div className="flex flex-wrap gap-4 px-4 py-3 bg-slate-50 border-b border-slate-100 text-xs text-slate-600">
          <div><span className="font-semibold text-slate-700">{summary.total}</span> rows</div>
          <div><span className="font-semibold text-success-700">{summary.matched}</span> matched</div>
          <div><span className="font-semibold text-slate-500">{summary.unmatched}</span> unmatched</div>
          {summary.total_client_kwh != null && (
            <div>Client total: <span className="font-semibold text-slate-700">{summary.total_client_kwh.toFixed(2)} kWh</span></div>
          )}
          {summary.total_loss_kwh != null && (
            <div>Total loss: <span className={`font-semibold ${summary.total_loss_kwh > 0 ? 'text-rose-600' : 'text-slate-700'}`}>{summary.total_loss_kwh.toFixed(2)} kWh</span></div>
          )}
        </div>
      )}
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr>
              {cols.map(c => (
                <th key={c} className="text-left px-4 py-3 text-xs font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 whitespace-nowrap">
                  {c}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {results.map((r, i) => {
              const loss = r.loss_kwh;
              const hasLoss = loss != null;
              return (
                <tr key={r.excel_row + '-' + i} className={i % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'}>
                  <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">{r.ocpp_date || <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs font-semibold text-slate-700 whitespace-nowrap">{display(r.vrn) || <NA />}</td>
                  <td className="px-4 py-3 text-slate-600 whitespace-nowrap">
                    {display([r.make, r.model].filter(Boolean).join(' ')) || <NA />}
                  </td>
                  <td className="px-4 py-3 text-slate-600 text-xs">{r.connector_id ?? <NA text="—" />}</td>
                  <td className="px-4 py-3 text-slate-600 text-xs whitespace-nowrap">{fmtDurationSecs(r.duration_seconds) || <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-700 whitespace-nowrap">{r.client_kwh != null ? r.client_kwh.toFixed(3) : <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs text-slate-600 whitespace-nowrap">{r.meter_kwh != null ? r.meter_kwh.toFixed(3) : <NA text="—" />}</td>
                  <td className="px-4 py-3 font-mono text-xs whitespace-nowrap">
                    {hasLoss ? (
                      <span className={loss > 0.1 ? 'font-semibold text-rose-600' : loss < -0.1 ? 'font-semibold text-amber-600' : 'text-slate-700'}>
                        {loss.toFixed(3)}
                      </span>
                    ) : <NA text="—" />}
                  </td>
                  <td className="px-4 py-3 whitespace-nowrap"><ConfidenceBadge level={r.confidence} /></td>
                  <td className="px-4 py-3 text-slate-500 text-xs" title={(r.match_reasons || []).join(', ')}>
                    {(r.match_reasons || []).join(', ') || <NA text="—" />}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── Stat Card ── */
function StatCard({ label, value, sub, accent }) {
  const accents = {
    blue:  { bar: 'bg-brand-500',   val: 'text-brand-600' },
    green: { bar: 'bg-success-500', val: 'text-success-600' },
    amber: { bar: 'bg-amber-400',   val: 'text-amber-600' },
    slate: { bar: 'bg-slate-300',   val: 'text-slate-700' },
  };
  const { bar, val } = accents[accent] || accents.slate;
  return (
    <div className="bg-white rounded-2xl shadow-card p-5 flex flex-col gap-1 relative overflow-hidden">
      <div className={`absolute top-0 left-0 right-0 h-0.5 ${bar}`} />
      <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{label}</p>
      <p className={`text-3xl font-bold ${val} leading-none`}>{value}</p>
      {sub && <p className="text-xs text-slate-400">{sub}</p>}
    </div>
  );
}

/* ── Section Header ── */
function SectionHeader({ icon, title, sub }) {
  return (
    <div className="flex items-center gap-2 mb-4">
      <div className="text-slate-400">{icon}</div>
      <div>
        <h2 className="text-sm font-bold text-slate-700">{title}</h2>
        {sub && <p className="text-xs text-slate-400">{sub}</p>}
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [stationData, setStationData] = React.useState(null);
  const [sessions,    setSessions]    = React.useState([]);
  const [violations,  setViolations]  = React.useState([]);
  const [lastUpdated, setLastUpdated] = React.useState(null);
  const [error,       setError]       = React.useState(null);
  const [lossResults, setLossResults] = React.useState(null);
  const [lossSummary, setLossSummary] = React.useState(null);
  const [uploading,   setUploading]   = React.useState(false);
  const [uploadError, setUploadError] = React.useState(null);
  const [uploadName,  setUploadName]  = React.useState(null);
  const [filterDate,  setFilterDate]  = React.useState(todayIST());

  const handleExcelUpload = async (file) => {
    if (!file) return;
    setUploading(true);
    setUploadError(null);
    setUploadName(file.name);
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch(`${BASE}/dashboard/energy-comparison/upload?camera_id=camera_01`, {
        method: 'POST',
        body: form,
      });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }
      const data = await res.json();
      setLossResults(data.results || []);
      setLossSummary(data.summary || null);
    } catch (e) {
      setUploadError(e.message);
      setLossResults(null);
      setLossSummary(null);
    } finally {
      setUploading(false);
    }
  };

  React.useEffect(() => {
    async function poll() {
      try {
        const [stRes, seRes, coRes] = await Promise.all([
          fetch(STATION_URL),
          fetch(sessionsUrl(filterDate)),
          fetch(COMPLIANCE_URL),
        ]);
        if (!stRes.ok) throw new Error(`Station API: HTTP ${stRes.status}`);
        if (!seRes.ok) throw new Error(`Sessions API: HTTP ${seRes.status}`);
        if (!coRes.ok) throw new Error(`Compliance API: HTTP ${coRes.status}`);

        const st = await stRes.json();
        const se = await seRes.json();
        const co = await coRes.json();

        setStationData(st);
        setSessions(se.sessions || []);
        setViolations(co.violations || []);
        setLastUpdated(fmtNowForStation());
        setError(null);
      } catch (e) {
        setError(e.message);
      }
    }
    poll();
    const id = setInterval(poll, POLL_MS);
    return () => clearInterval(id);
  }, [filterDate]);

  const slots        = stationData?.slots || {};
  const activeCount  = sessions.filter(s => ['charging', 'active'].includes((s.session_status || '').toLowerCase())).length;
  const slotStatuses = SLOTS.map(id => (slots[id]?.status || 'empty').toLowerCase());
  const idleSlots    = slotStatuses.filter(s => s === 'empty').length;
  const violCount    = deduplicateViolations(violations).length;
  const totalKwh     = Object.values(slots).reduce((sum, s) => sum + (s?.energy_kwh ?? 0), 0);

  return (
    <div className="min-h-screen bg-[#F9FAFB]">

      {/* ── Top Nav ── */}
      <nav className="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
        <div className="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
          {/* Left: brand + breadcrumb */}
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-1.5 text-brand-600">
              <IconBolt />
              <span className="font-bold text-slate-800 text-sm">EV Monitor</span>
            </div>
            <span className="text-slate-300 text-sm">/</span>
            <div className="flex items-center gap-1.5 text-slate-500 text-sm">
              <IconStation />
              <span>station_01</span>
            </div>
            <span className="text-slate-300 text-sm">/</span>
            <span className="text-slate-800 text-sm font-semibold">Live Dashboard</span>
          </div>

          {/* Right: live indicator + time */}
          <div className="flex items-center gap-3">
            {lastUpdated ? (
              <>
                <div className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-success-500 animate-pulse-dot" />
                  <span className="text-xs font-semibold text-success-600">Live</span>
                </div>
                <span className="text-xs text-slate-400 hidden sm:block">Updated {lastUpdated}</span>
              </>
            ) : (
              <span className="text-xs text-slate-400">Connecting…</span>
            )}
          </div>
        </div>
      </nav>

      {/* ── Main content ── */}
      <main className="max-w-6xl mx-auto px-6 py-8">

        {/* Error banner */}
        {error && (
          <div className="mb-6 flex items-center gap-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl px-4 py-3 text-sm">
            <IconWarning />
            <span className="font-medium">API Error:</span> {error}
          </div>
        )}

        {/* ── Stat Cards ── */}
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-8">
          <StatCard label="Total Stations"   value={1}            accent="slate" />
          <StatCard label="Active Sessions"  value={activeCount}  sub="Currently charging" accent="green" />
          <StatCard label="Idle Slots"       value={idleSlots}    sub="Available now"      accent="blue" />
          <StatCard label="Live Energy"      value={totalKwh > 0 ? `${totalKwh.toFixed(2)} kWh` : '—'} sub="Across active slots" accent="blue" />
          <StatCard label="Violations"       value={violCount}    sub="Deduplicated"       accent={violCount > 0 ? 'amber' : 'slate'} />
        </div>

        {/* ── Parking Bays ── */}
        <div className="mb-8">
          <SectionHeader
            icon={<IconCar />}
            title="Live Parking Bays"
            sub={`station_01 · ${SLOTS.length} slots`}
          />
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
            {SLOTS.map(slotId => (
              <BayCard key={slotId} slotId={slotId} data={slots[slotId]} />
            ))}
          </div>
        </div>

        {/* ── Sessions Table ── */}
        <div className="mb-8">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-2">
              <div className="text-slate-400"><IconBolt /></div>
              <div>
                <h2 className="text-sm font-bold text-slate-700">Charging Sessions</h2>
                <p className="text-xs text-slate-400">
                  {sessions.length} session{sessions.length !== 1 ? 's' : ''} on {filterDate}
                </p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Date</label>
              <input
                type="date"
                value={filterDate}
                max={todayIST()}
                onChange={e => setFilterDate(e.target.value)}
                className="text-sm border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent"
              />
              <button
                onClick={() => setFilterDate(todayIST())}
                className="text-xs px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium transition-colors"
              >
                Today
              </button>
            </div>
          </div>
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <SessionsTable sessions={sessions} />
          </div>
        </div>

        {/* ── Energy Loss Analysis ── */}
        <div className="mb-8">
          <div className="flex items-center justify-between mb-3">
            <SectionHeader
              icon={<IconBolt />}
              title="Energy Loss Analysis"
              sub="Client OCPP Excel vs. meter-derived estimate"
            />
            <div className="flex items-center gap-3">
              {uploadName && (
                <span className="text-xs text-slate-500 truncate max-w-[200px]" title={uploadName}>
                  {uploadName}
                </span>
              )}
              <label className={`inline-flex items-center gap-2 px-4 py-2 rounded-lg cursor-pointer text-sm font-semibold transition-colors ${uploading ? 'bg-slate-200 text-slate-500 cursor-wait' : 'bg-brand-600 hover:bg-brand-700 text-white'}`}>
                {uploading ? 'Processing…' : 'Upload Excel'}
                <input
                  type="file"
                  accept=".xlsx,.xlsm"
                  disabled={uploading}
                  className="hidden"
                  onChange={(e) => {
                    const f = e.target.files && e.target.files[0];
                    if (f) handleExcelUpload(f);
                    e.target.value = '';
                  }}
                />
              </label>
            </div>
          </div>
          {uploadError && (
            <div className="mb-3 flex items-center gap-3 bg-rose-50 border border-rose-100 text-rose-700 rounded-xl px-4 py-3 text-sm">
              <IconWarning />
              <span className="font-medium">Upload failed:</span> {uploadError}
            </div>
          )}
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <EnergyLossTable results={lossResults} summary={lossSummary} />
          </div>
        </div>

        {/* ── Compliance Table ── */}
        <div className="mb-8">
          <SectionHeader
            icon={<IconWarning />}
            title="Parking Compliance Violations"
            sub="Grouped by car and violation type"
          />
          <div className="bg-white rounded-2xl shadow-card overflow-hidden">
            <ComplianceTable violations={violations} />
          </div>
        </div>

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
