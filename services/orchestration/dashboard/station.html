<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV Station Monitor</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    #root { max-width: 1000px; margin: 0 auto; }

    /* ── Header ── */
    .page-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 2px;
      letter-spacing: 0.04em;
    }
    .page-subtitle {
      font-size: 12px;
      color: #555;
      margin-bottom: 28px;
    }

    /* ── Network Overview ── */
    .section-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    .stat-box {
      border: 1px solid #222;
      background: #141414;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-sub {
      font-size: 11px;
      color: #555;
    }

    /* ── Sessions Table ── */
    .sessions-wrap {
      margin-bottom: 32px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead tr {
      border-bottom: 1px solid #2a2a2a;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      color: #555;
      font-weight: normal;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid #1a1a1a;
      color: #ccc;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }

    .td-null { color: #3a3a3a; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }
    .badge-charging  { background: #0d2a38; color: #4fc3f7; }
    .badge-active    { background: #0d2010; color: #81c995; }
    .badge-completed { background: #1e1e1e; color: #666; }
    .badge-incomplete{ background: #2a1a0d; color: #ffb74d; }

    .empty-row td {
      text-align: center;
      color: #3a3a3a;
      padding: 24px;
    }

    /* ── Slot Cards ── */
    .slots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .slots-grid { grid-template-columns: 1fr; }
    }

    .slot-box {
      border: 1px solid #222;
      padding: 16px 18px;
      background: #141414;
    }

    .slot-name {
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 12px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .field-row {
      display: flex;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .field-label {
      color: #666;
      min-width: 130px;
      flex-shrink: 0;
    }

    .field-value        { color: #ccc; }
    .field-value.null   { color: #333; }

    .status-charging  { color: #4fc3f7; font-weight: bold; }
    .status-active    { color: #81c995; font-weight: bold; }
    .status-completed { color: #666; }
    .status-empty     { color: #444; }
    .violation-value  { color: #ff7043; }

    .error-box {
      color: #ff5555;
      font-size: 12px;
      border: 1px solid #3a1a1a;
      padding: 10px 14px;
      background: #1a0d0d;
      margin-bottom: 20px;
    }

    .last-updated {
      font-size: 11px;
      color: #444;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const BASE      = 'http://13.201.133.171:8000';
const STATION_URL  = `${BASE}/dashboard/station?camera_id=camera_01&station_id=station_01`;
const SESSIONS_URL = `${BASE}/dashboard/sessions?camera_id=camera_01&limit=50`;
const POLL_MS   = 2000;
const SLOTS     = ['ROI_1', 'ROI_2'];

/* ── helpers ── */
function display(v) {
  if (v === null || v === undefined || v === '') return null;
  return String(v);
}

function fmtTime(iso) {
  if (!iso) return null;
  try { return new Date(iso).toLocaleTimeString(); } catch { return iso; }
}

function duration(inIso, outIso) {
  const start = inIso ? new Date(inIso) : null;
  const end   = outIso ? new Date(outIso) : new Date();
  if (!start || isNaN(start)) return null;
  const secs = Math.floor((end - start) / 1000);
  if (secs < 0) return null;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function statusBadge(status) {
  if (!status) return <span className="td-null">--</span>;
  const cls = {
    charging:   'badge-charging',
    active:     'badge-active',
    completed:  'badge-completed',
    incomplete: 'badge-incomplete',
  }[status.toLowerCase()] || '';
  return <span className={`badge ${cls}`}>{status.toUpperCase()}</span>;
}

/* ── Field row ── */
function Field({ label, value, className }) {
  const v = display(value);
  return (
    <div className="field-row">
      <span className="field-label">{label}</span>
      <span className={`field-value${v === null ? ' null' : ''}${className ? ' ' + className : ''}`}>
        {v !== null ? v : '--'}
      </span>
    </div>
  );
}

/* ── Slot card ── */
function SlotCard({ slotId, data }) {
  const isEmpty = !data || data.status === 'empty';
  const statusCls = () => {
    if (!data) return '';
    const s = (data.status || '').toLowerCase();
    if (s === 'charging') return 'status-charging';
    if (s === 'active')   return 'status-active';
    if (s === 'completed') return 'status-completed';
    return '';
  };

  return (
    <div className="slot-box">
      <div className="slot-name">{slotId}</div>
      {isEmpty ? (
        <Field label="Status" value="EMPTY" className="status-empty" />
      ) : (
        <>
          <Field label="Car Number"    value={data.car_number} />
          <Field label="Car Model"     value={data.car_model} />
          <Field label="Car In Time"   value={data.car_intime} />
          <Field label="Car Out Time"  value={data.car_outtime} />
          <Field label="Gun Number"    value={data.gun_number} />
          <Field label="Plug In Time"  value={data.gun_plugin_time} />
          <Field label="Plug Out Time" value={data.gun_plugout_time} />
          <Field label="Status"        value={data.status ? data.status.toUpperCase() : null} className={statusCls()} />
          <Field label="Violation"     value={data.violation || 'NONE'} className={data.violation ? 'violation-value' : ''} />
        </>
      )}
    </div>
  );
}

/* ── Sessions table ── */
function SessionsTable({ sessions }) {
  if (!sessions.length) {
    return (
      <table>
        <thead>
          <tr>
            <th>Session ID</th><th>Station</th><th>Car Model</th>
            <th>Region</th><th>Duration</th><th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr className="empty-row"><td colSpan="6">No sessions found</td></tr>
        </tbody>
      </table>
    );
  }

  return (
    <table>
      <thead>
        <tr>
          <th>Session ID</th>
          <th>Station</th>
          <th>Car Model</th>
          <th>Region</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {sessions.map(s => (
          <tr key={s.session_id}>
            <td>#{s.session_id}</td>
            <td>Station 1</td>
            <td>{display(s.car_model) || <span className="td-null">--</span>}</td>
            <td>Kochi</td>
            <td>{duration(s.in_time, s.out_time) || <span className="td-null">--</span>}</td>
            <td>{statusBadge(s.session_status)}</td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

/* ── App ── */
function App() {
  const [stationData,  setStationData]  = React.useState(null);
  const [sessions,     setSessions]     = React.useState([]);
  const [lastUpdated,  setLastUpdated]  = React.useState(null);
  const [error,        setError]        = React.useState(null);

  React.useEffect(() => {
    async function poll() {
      try {
        const [stRes, seRes] = await Promise.all([
          fetch(STATION_URL),
          fetch(SESSIONS_URL),
        ]);
        if (!stRes.ok) throw new Error(`Station API: HTTP ${stRes.status}`);
        if (!seRes.ok) throw new Error(`Sessions API: HTTP ${seRes.status}`);

        const st = await stRes.json();
        const se = await seRes.json();

        setStationData(st);
        setSessions(se.sessions || []);
        setLastUpdated(new Date().toLocaleTimeString());
        setError(null);
      } catch (e) {
        setError(e.message);
      }
    }

    poll();
    const id = setInterval(poll, POLL_MS);
    return () => clearInterval(id);
  }, []);

  const slots = stationData?.slots || {};

  /* Network overview stats */
  const totalStations  = 1;
  const activeCount    = sessions.filter(s => ['charging', 'active'].includes((s.session_status || '').toLowerCase())).length;
  const idleSlots      = SLOTS.filter(id => !slots[id] || slots[id].status === 'empty').length;
  const totalSessions  = sessions.length;

  return (
    <>
      <div className="page-title">EV Charging Monitor</div>
      <div className="last-updated">
        {lastUpdated ? `Last updated: ${lastUpdated}` : 'Connecting…'}
      </div>

      {error && <div className="error-box">Error: {error}</div>}

      {/* ── Network Overview ── */}
      <div className="section-label">Network Overview — Real-time status across all stations</div>
      <div className="stats-grid">
        <div className="stat-box">
          <div className="stat-label">Total Stations</div>
          <div className="stat-value">{totalStations}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Active Sessions</div>
          <div className="stat-value">{activeCount}</div>
          <div className="stat-sub">Currently charging</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Idle Slots</div>
          <div className="stat-value">{idleSlots}</div>
        </div>
        <div className="stat-box">
          <div className="stat-label">Total Sessions</div>
          <div className="stat-value">{totalSessions}</div>
          <div className="stat-sub">All time</div>
        </div>
      </div>

      {/* ── Charging Sessions Table ── */}
      <div className="section-label" style={{marginBottom: '10px'}}>Charging Sessions</div>
      <div className="sessions-wrap">
        <SessionsTable sessions={sessions} />
      </div>

      {/* ── Live Slot Status ── */}
      <div className="section-label" style={{marginBottom: '10px'}}>
        Live Slot Status — {stationData?.station_id || 'station_01'}
      </div>
      <div className="slots-grid">
        {SLOTS.map(slotId => (
          <SlotCard key={slotId} slotId={slotId} data={slots[slotId]} />
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
