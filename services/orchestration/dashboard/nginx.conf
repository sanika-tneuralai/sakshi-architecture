# ═══════════════════════════════════════════════════════════
# GOEC Surveillance Dashboard — Nginx Configuration
# Deploy: copy this file to /etc/nginx/sites-available/goec
# Then: sudo ln -s /etc/nginx/sites-available/goec /etc/nginx/sites-enabled/goec
#       sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;          # Replace with your EC2 public IP or domain

    # ── Static dashboard files ──────────────────────────────
    root /var/www/goec/dashboard;
    index login.html;

    # All unmatched routes → login (entry point)
    location / {
        try_files $uri $uri/ /login.html;
    }

    # Explicit page routes (no extension needed in address bar)
    location = /home            { return 301 /home.html; }
    location = /login           { return 301 /login.html; }
    location = /analytics       { return 301 /analytics.html; }
    location = /parking         { return 301 /parking_detection.html; }
    location = /gun             { return 301 /gun_detection.html; }
    location = /compliance      { return 301 /parking_compliance.html; }
    location = /safety          { return 301 /safety_monitoring.html; }

    # ── Proxy: Orchestration Service (port 8000) ────────────
    location /api/orchestration/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Proxy: Usecase Service (port 8001) ──────────────────
    location /api/usecase/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Proxy: Alert Service (port 8002) ────────────────────
    location /api/alert/ {
        proxy_pass         http://127.0.0.1:8002/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Proxy: Camera Detection Service (port 8004) ─────────
    location /api/camera/ {
        proxy_pass         http://127.0.0.1:8004/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Security headers ────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "no-referrer"  always;

    # ── Compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Cache static assets ─────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# ─────────────────────────────────────────────
# NOTE: If you want to use the /api/* proxies
# instead of direct localhost URLs, update
# CONFIG in app.js to:
#
#   orchestrationUrl:   '/api/orchestration',
#   usecaseUrl:         '/api/usecase',
#   alertUrl:           '/api/alert',
#   cameraDetectionUrl: '/api/camera',
#
# This avoids CORS issues entirely and lets
# Nginx handle all routing from one domain.
# ─────────────────────────────────────────────
