<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GOEC — Safety Alerts</title>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>
  <div class="main-area" id="main-area">

    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">🔥 Safety Alerts</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-refresh">Updated <span id="last-refresh">—</span></span>
      </div>
    </div>

    <div class="page-content">

      <div class="page-header">
        <div class="page-header-left">
          <span class="page-icon">🔥</span>
          <div>
            <h2>Safety Alerts</h2>
            <div class="page-sub">Live monitoring of fire, smoke, and other safety hazards at the charging site</div>
          </div>
        </div>
        <span class="badge loading" id="status-badge">Loading…</span>
      </div>

      <div class="grid-2">

        <!-- LEFT column -->
        <div style="display:flex;flex-direction:column;gap:var(--gap)">

          <!-- Latest snapshot -->
          <div class="card">
            <div class="card-header"><h3>📷 Latest Snapshot</h3></div>
            <div class="card-body" style="padding:0">
              <div class="live-frame-box" id="snapshot-box">
                <div class="frame-empty"><div class="frame-icon">📷</div>No snapshot yet</div>
              </div>
            </div>
          </div>

          <!-- Alert history -->
          <div class="card">
            <div class="card-header">
              <h3>📋 Event History</h3>
              <span id="alert-count-badge" style="font-size:12px;color:var(--muted)"></span>
            </div>
            <div class="alerts-list" id="alert-list" style="max-height:420px;overflow-y:auto">
              <div class="spinner-wrap"><div class="spinner"></div></div>
            </div>
          </div>

        </div>

        <!-- RIGHT column: detail panel -->
        <div class="card" id="detail-panel">
          <div class="card-header"><h3>🔍 Event Detail</h3></div>
          <div class="card-body" id="detail-body">
            <div style="text-align:center;color:var(--muted);padding:48px 16px">
              <div style="font-size:32px;margin-bottom:8px">👆</div>
              Select an event to view details
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="app.js"></script>
<script>
  Auth.requireAuth();
  injectSidebarHTML('safety_monitoring');
  initSidebar();

  const UC_ID = 'safety_monitoring';
  let prevAlerts = null;

  /* ── Human-readable description ── */
  function describeAlert(alert) {
    const extras = alert.extras || {};
    const events = extras.events || [];
    if (events.length === 0) return 'Safety hazard detected';

    const parts = events.map(ev => {
      if (ev.event_type === 'safety_alert') {
        const hazard = (ev.metadata && ev.metadata.hazard_type) ? ev.metadata.hazard_type.toLowerCase() : '';
        if (hazard === 'fire')  return 'Fire detected';
        if (hazard === 'smoke') return 'Smoke detected';
        if (hazard)             return `${hazard.charAt(0).toUpperCase() + hazard.slice(1)} hazard detected`;
      }
      return 'Safety hazard detected';
    });
    return parts.join('; ');
  }

  /* ── Detail panel extras (plain English) ── */
  function extrasHTML(alert) {
    const extras = alert.extras || {};
    const events = extras.events || [];
    if (events.length === 0) return '';

    return events.map(ev => {
      const meta       = ev.metadata || {};
      const hazard     = meta.hazard_type
        ? `<div class="modal-field"><label>Hazard</label><div class="val">${escHtml(meta.hazard_type.charAt(0).toUpperCase() + meta.hazard_type.slice(1))}</div></div>`
        : '';
      const confidence = (meta.confidence !== undefined && meta.confidence !== null)
        ? `<div class="modal-field"><label>Confidence</label><div class="val">${escHtml(String(Math.round(Number(meta.confidence) * 100) || meta.confidence))}%</div></div>`
        : '';
      return hazard + confidence;
    }).join('');
  }

  /* ── Show detail in right panel ── */
  async function showDetail(alert, idx) {
    let snap = '';
    if (alert.snapshot_url) {
      snap = `<img src="${alert.snapshot_url}" alt="Event snapshot" style="width:100%;border-radius:6px;margin-bottom:16px"/>`;
    }
    const desc = describeAlert(alert);
    document.getElementById('detail-body').innerHTML = `
      ${snap}
      <div class="modal-field">
        <label>Description</label>
        <div class="val" style="font-size:14px">${escHtml(desc)}</div>
      </div>
      <div class="modal-field">
        <label>Time</label>
        <div class="val">${fmtTsFull(alert.timestamp)}</div>
      </div>
      ${extrasHTML(alert)}
    `;
    document.querySelectorAll('#alert-list .alert-item').forEach((el, i) => {
      el.style.background = i === idx ? 'rgba(218,54,51,0.1)' : '';
    });
  }

  /* ── Render alert list ── */
  function renderAlerts(alertsArr) {
    const listEl = document.getElementById('alert-list');
    if (alertsArr.length === 0) {
      listEl.innerHTML = '<div class="no-alerts"><div class="no-alerts-icon">✅</div>No safety alerts recorded</div>';
      return;
    }
    listEl.innerHTML = alertsArr.map((a, i) => `
      <div class="alert-item" onclick="showDetail(window._alerts[${i}], ${i})">
        <div class="alert-icon">🚨</div>
        <div class="alert-body">
          <div class="alert-type">${escHtml(describeAlert(a))}</div>
        </div>
        <div class="alert-ts">${fmtTsFull(a.timestamp)}</div>
      </div>
    `).join('');
  }

  /* ── Main refresh ── */
  async function refreshNow() {
    const [alertData, pipeline] = await Promise.all([
      fetchJSON(`${CONFIG.alertUrl}/alert/list?camera_id=${CONFIG.cameraId}&usecase_name=${UC_ID}&limit=50`),
      fetchJSON(`${CONFIG.orchestrationUrl}/pipeline/status/${CONFIG.cameraId}`),
    ]);

    const alertsArr = (alertData && alertData.alerts) ? alertData.alerts : [];
    const fetchFailed = alertData === null;

    const badge = document.getElementById('status-badge');
    if (pipeline === null) {
      badge.textContent = 'Offline';
      badge.className   = 'badge inactive';
    } else if (pipeline.running) {
      badge.textContent = 'Monitoring';
      badge.className   = 'badge active';
    } else {
      badge.textContent = 'Idle';
      badge.className   = 'badge loading';
    }

    document.getElementById('alert-count-badge').textContent =
      alertsArr.length ? `${alertsArr.length} alert${alertsArr.length !== 1 ? 's' : ''}` : '';

    renderSnapshot('snapshot-box', alertsArr);

    const listEl = document.getElementById('alert-list');
    if (fetchFailed) {
      listEl.innerHTML = '<div class="error-state">⚠️ Unable to load events. Please try again shortly.</div>';
    } else {
      if (prevAlerts) {
        const prevIds = new Set(prevAlerts.map(a => a.alert_id));
        alertsArr.filter(a => !prevIds.has(a.alert_id)).forEach(a => {
          Toast.show({ title: 'Safety Alert', message: describeAlert(a), type: 'danger' });
        });
      }
      renderAlerts(alertsArr);
    }

    window._alerts = alertsArr;
    prevAlerts = alertsArr;
    setLastRefresh();
  }

  refreshNow();
  setInterval(refreshNow, CONFIG.refreshIntervalMs);
</script>
</body>
</html>
