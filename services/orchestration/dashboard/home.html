<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GOEC — Overview</title>
  <link rel="stylesheet" href="shared.css"/>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-slot"></div>

  <div class="main-area" id="main-area">

    <div class="topbar">
      <div class="topbar-left">
        <h2 class="topbar-title">Overview</h2>
      </div>
      <div class="topbar-right">
        <span class="topbar-refresh">Updated: <span id="last-refresh">—</span></span>
      </div>
    </div>

    <div class="page-content">

      <!-- Monitoring status badge -->
      <div style="margin-bottom:28px">
        <span class="badge loading" id="monitoring-badge">Checking…</span>
      </div>

      <!-- 2x2 usecase summary cards -->
      <div class="grid-auto" id="uc-grid">
        <!-- Injected by JS -->
      </div>

    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="app.js"></script>
<script>
  Auth.requireAuth();
  injectSidebarHTML('home');
  initSidebar();

  /* ── Human-readable time-ago ── */
  function timeAgo(ts) {
    if (!ts) return 'unknown time';
    const diffMs = Date.now() - new Date(ts).getTime();
    if (isNaN(diffMs) || diffMs < 0) return 'just now';
    const secs  = Math.floor(diffMs / 1000);
    const mins  = Math.floor(secs  / 60);
    const hours = Math.floor(mins  / 60);
    const days  = Math.floor(hours / 24);
    if (secs  <  60) return 'just now';
    if (mins  <   2) return '1 minute ago';
    if (mins  <  60) return `${mins} minutes ago`;
    if (hours <   2) return '1 hour ago';
    if (hours <  24) return `${hours} hours ago`;
    if (days  <   2) return 'yesterday';
    return `${days} days ago`;
  }

  /* ── Today's date string (YYYY-MM-DD) for filtering ── */
  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  /* ── Build card skeleton ── */
  function buildGrid() {
    const grid = document.getElementById('uc-grid');
    grid.innerHTML = USECASES.map(uc => `
      <div class="card usecase-card"
           style="border-left:3px solid ${uc.color};cursor:pointer"
           onclick="location.href='${uc.page}'">
        <div class="card-body">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <span style="font-size:24px">${uc.icon}</span>
            <span style="font-weight:600;font-size:15px">${uc.label}</span>
          </div>
          <div style="font-size:32px;font-weight:700;margin-bottom:4px" id="count-${uc.id}">—</div>
          <div style="font-size:12px;color:var(--muted)" id="last-${uc.id}">Loading…</div>
        </div>
      </div>
    `).join('');
  }

  /* ── Main refresh ── */
  async function refresh() {
    const today = todayStr();

    const [pipeline, ...alertResults] = await Promise.all([
      fetchJSON(`${CONFIG.orchestrationUrl}/pipeline/status/${CONFIG.cameraId}`),
      ...USECASES.map(uc =>
        fetchJSON(
          `${CONFIG.alertUrl}/alert/list?camera_id=${CONFIG.cameraId}&usecase_name=${uc.id}&limit=200`,
          null
        )
      ),
    ]);

    /* Monitoring badge */
    const badge = document.getElementById('monitoring-badge');
    if (pipeline === null) {
      badge.textContent = 'Offline';
      badge.className   = 'badge inactive';
    } else if (pipeline.running) {
      badge.textContent = 'Monitoring';
      badge.className   = 'badge active';
    } else {
      badge.textContent = 'Offline';
      badge.className   = 'badge inactive';
    }

    /* Usecase cards */
    USECASES.forEach((uc, i) => {
      const raw    = alertResults[i];
      const alerts = Array.isArray(raw)
        ? raw
        : (raw && Array.isArray(raw.alerts) ? raw.alerts : []);

      /* Filter to today only */
      const todayAlerts = alerts.filter(a => {
        if (!a.timestamp) return false;
        return a.timestamp.slice(0, 10) === today;
      });

      const count    = todayAlerts.length;
      const countEl  = document.getElementById(`count-${uc.id}`);
      const lastEl   = document.getElementById(`last-${uc.id}`);

      if (countEl) countEl.textContent = raw === null ? '—' : count;

      if (lastEl) {
        if (raw === null) {
          lastEl.textContent = 'Unable to load';
        } else if (todayAlerts.length === 0) {
          lastEl.textContent = 'No events today';
        } else {
          /* Most recent alert by timestamp */
          const latest = todayAlerts.reduce((best, a) =>
            new Date(a.timestamp) > new Date(best.timestamp) ? a : best
          , todayAlerts[0]);
          lastEl.textContent = `Last event: ${timeAgo(latest.timestamp)}`;
        }
      }
    });

    setLastRefresh();
  }

  buildGrid();
  refresh();
  setInterval(refresh, CONFIG.refreshIntervalMs);
</script>
</body>
</html>
