# ---------------------------------------------------------------------------
# Camera-sharded usecase workers.
#
# Each camera is pinned to shard  crc32(camera_id) % N_SHARDS  (see
# workers/queue.py). One worker per shard, --concurrency=1, so:
#   * a camera's frames are processed strictly in order on its shard lane;
#   * different cameras run in parallel across shard workers.
# ONE whole-frame task carries all usecases (workers/tasks.evaluate_frame_task),
# so usecases run in dependency order and ChargingSession assembles correctly.
#
# Scaling: keep N_SHARDS == the number of worker-shard-* services below and set
# it in BOTH the shared env and the usecase service. 5 shards for ~5 cameras;
# raise to 12-16 for ~50, 32-64 (across hosts) for ~500.
# ---------------------------------------------------------------------------

# Cap container stdout logs. Docker's default json-file driver keeps logs
# UNBOUNDED, so 8 chatty containers over a multi-day soak will fill the disk
# and take the box down. 10 MB x 3 files = 30 MB/container ceiling (~240 MB
# for the whole stack). Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-worker-env: &worker-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  N_SHARDS: '5'
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sakshi-vehicle-detection-frames}

x-shard-worker: &shard-worker
  build: .
  environment: *worker-env
  logging: *default-logging
  extra_hosts:
    - "host.docker.internal:host-gateway"
  # The image HEALTHCHECK pings :8001 (the API). Workers run celery, not the
  # API, so that probe always fails and mislabels a healthy worker "unhealthy".
  # Disable it here — worker liveness is visible in Flower and the logs.
  healthcheck:
    disable: true
  depends_on:
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    logging: *default-logging
    ports:
      - '5672:5672' #AMQP port (Celery broker)
      - '15672:15672' #management UI -> http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    logging: *default-logging
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One single-slot worker per shard. To change the shard count, add/remove
  # worker-shard-N services here and update N_SHARDS above + in the usecase env.
  worker-shard-0:
    <<: *shard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info --concurrency=1
      --queues=usecase_shard_0 --hostname=worker-shard-0@%h

  worker-shard-1:
    <<: *shard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info --concurrency=1
      --queues=usecase_shard_1 --hostname=worker-shard-1@%h

  worker-shard-2:
    <<: *shard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info --concurrency=1
      --queues=usecase_shard_2 --hostname=worker-shard-2@%h

  worker-shard-3:
    <<: *shard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info --concurrency=1
      --queues=usecase_shard_3 --hostname=worker-shard-3@%h

  worker-shard-4:
    <<: *shard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info --concurrency=1
      --queues=usecase_shard_4 --hostname=worker-shard-4@%h

  flower:
    build: .
    command: celery -A workers.celery_app flower --port=5555
    logging: *default-logging
    # Flower serves on 5555, not the API's 8001 — disable the image healthcheck
    # so it isn't mislabelled "unhealthy".
    healthcheck:
      disable: true
    ports:
      - '5555:5555' # Flower UI -> http://localhost:5555
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      worker-shard-0:
        condition: service_started

  usecase:
    build: .
    # No --reload for a soak run: the file-watcher adds overhead and an
    # accidental edit would restart the API mid-test. Add it back for dev.
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    logging: *default-logging
    ports:
      - '8001:8001'
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      USE_WORKER_QUEUE: 'true'
      N_SHARDS: '5'          # MUST match the number of worker-shard-* services
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sakshi-vehicle-detection-frames}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
