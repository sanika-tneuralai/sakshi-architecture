# =============================================================================
# Camera-Detection (DeepStream backend) — single GPU service.
#
# Postgres is intentionally NOT here: per the architecture the DB lives only
# behind the orchestration service; decode-detect needs no DB (init fails
# non-fatally). This compose is just the GPU inference service.
#
# First `docker compose up` builds the image AND (on first /camera/start) builds
# the b8 TensorRT engine (~5 min, one time) into the ds-yolo volume. After that,
# restarts deserialize the cached engine in seconds.
#
# Requires: docker + nvidia-container-toolkit, and models/goec_N_v1.pt present
# in the build context.
# =============================================================================
services:
  camera-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: goec-camera-detection:deepstream
    container_name: goec-camera-detection
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      INFERENCE_BACKEND: deepstream
      DEEPSTREAM_MAX_BATCH: ${DEEPSTREAM_MAX_BATCH:-8}
      DEEPSTREAM_PUBLISH_FPS: ${DEEPSTREAM_PUBLISH_FPS:-5}
      DEEPSTREAM_WIDTH: ${DEEPSTREAM_WIDTH:-1920}
      DEEPSTREAM_HEIGHT: ${DEEPSTREAM_HEIGHT:-1080}
      # S3 frame store (optional — snapshot_url is null if unset; fail-open).
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    ports:
      - "8004:8004"

    volumes:
      # Persists the DeepStream-Yolo artifacts + the built b8 TensorRT engine so
      # it isn't rebuilt on every container recreate.
      - ds-yolo:/app/deepstream/DeepStream-Yolo
      - ./logs:/app/logs

volumes:
  ds-yolo:
    driver: local
